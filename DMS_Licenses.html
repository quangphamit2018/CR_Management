<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masterdata Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <meta name="description" content="Cổng quản lý Masterdata với xác thực Google và phân quyền Supabase." />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    /* =====================================================================
       Masterdata Portal — Crimson theme
       Màu gốc #b71c1c. Gradient đi từ đỏ tươi (#e53935) → đỏ gốc → đỏ rượu vang (#3d080c),
       điểm nhấn vàng hổ phách (#ffc857) dùng rất tiết chế cho trạng thái active / eyebrow.
       ===================================================================== */
    :root {
      --ink: #2a1416;
      --ink-2: #4a2f31;
      --muted: #80666a;
      --line: #f1dedd;
      --line-strong: #e7c7c5;
      --surface: #ffffff;
      --surface-soft: #fdf6f5;

      --brand: #b71c1c;
      --brand-light: #e53935;
      --brand-dark: #8e1216;
      --brand-deep: #5a0d12;
      --brand-soft: #fdeceb;
      --brand-soft-2: #fbd5d2;
      --gold: #ffc857;

      --g-brand: linear-gradient(135deg, #dc3b36 0%, #b71c1c 52%, #8a1015 100%);
      --g-brand-hover: linear-gradient(135deg, #ea4a44 0%, #c62626 52%, #9b1419 100%);
      --g-deep: linear-gradient(165deg, #6b1117 0%, #3d080c 58%, #1e0407 100%);
      --g-soft: linear-gradient(135deg, #fff3f2 0%, #fde2df 100%);
      --g-text: linear-gradient(100deg, #3d080c 0%, #b71c1c 100%);

      --success: #0b7a4f;
      --success-soft: #e4f6ed;
      --warning: #b45309;
      --warning-soft: #fff3df;
      --danger: #a31515;
      --danger-soft: #ffeceb;

      --shadow: 0 22px 60px rgba(90, 13, 18, .14);
      --shadow-card: 0 1px 2px rgba(90, 13, 18, .05), 0 10px 28px rgba(120, 20, 24, .06);
      --radius: 18px;
      --sidebar: 262px;
      font-family: "Be Vietnam Pro", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #fbf3f2;
    }
    * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #dba7a4 transparent; }
    *::-webkit-scrollbar { width: 9px; height: 9px; }
    *::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #e8a9a5, #c96a66); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
    ::selection { background: #b71c1c; color: #fff; }
    body {
      margin: 0; min-width: 320px; color: var(--ink);
      background:
        radial-gradient(900px 480px at 92% -8%, rgba(229, 57, 53, .11), transparent 62%),
        radial-gradient(800px 520px at -8% 108%, rgba(183, 28, 28, .08), transparent 60%),
        #fbf3f2;
      background-attachment: fixed;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--brand-light); outline-offset: 2px; }
    .hidden { display: none !important; }
    .app-shell { min-height: 100vh; display: flex; }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: var(--sidebar); flex: 0 0 var(--sidebar); color: #f0d4d2; overflow: hidden;
      background: var(--g-deep);
      display: flex; flex-direction: column; padding: 24px 16px; position: fixed; inset: 0 auto 0 0; z-index: 20;
    }
    .sidebar::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(260px 220px at 0% 0%, rgba(239, 83, 80, .45), transparent 70%),
        radial-gradient(240px 260px at 100% 100%, rgba(183, 28, 28, .40), transparent 70%);
    }
    .sidebar > * { position: relative; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 12px; padding: 2px 10px 30px; color: #fff; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff; flex: 0 0 auto;
      background: linear-gradient(135deg, #ff7a6b 0%, #e53935 45%, #a51218 100%);
      box-shadow: 0 6px 18px rgba(229, 57, 53, .45), inset 0 1px 0 rgba(255, 255, 255, .38);
    }
    .brand-mark svg { width: 19px; height: 19px; }
    .brand strong { font-size: 15px; letter-spacing: -.02em; }
    .brand small { display: block; color: #d8a7a5; font-size: 10.5px; margin-top: 3px; }
    .nav-label { font-size: 11px; font-weight: 600; letter-spacing: .02em; color: rgba(255, 220, 217, .5); padding: 0 12px 9px; }
    .nav { display: grid; gap: 5px; }
    .nav button {
      border: 0; background: transparent; color: #dfb9b7; text-align: left; padding: 11px 12px; font-weight: 500;
      border-radius: 12px; display: flex; align-items: center; gap: 11px; transition: .18s ease;
    }
    .nav button:hover { background: rgba(255, 255, 255, .09); color: #fff; }
    .nav button.active {
      color: #fff; font-weight: 650;
      background: linear-gradient(100deg, #e53935 0%, #b71c1c 70%, #94141a 100%);
      box-shadow: inset 3px 0 0 var(--gold), 0 8px 20px rgba(0, 0, 0, .28);
    }
    .nav button:focus-visible, .signout:focus-visible { outline-color: var(--gold); }
    .nav svg { width: 17px; height: 17px; flex: 0 0 auto; }
    .sidebar-foot { margin-top: auto; padding: 16px 10px 0; border-top: 1px solid rgba(255, 255, 255, .12); }
    .user-chip { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; min-width: 0; }
    .avatar {
      width: 33px; height: 33px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: 0 0 auto;
      background: linear-gradient(135deg, #ffe0a8, #ff9a76); color: #5a0d12; box-shadow: 0 0 0 2px rgba(255, 255, 255, .18);
    }
    .user-chip div:last-child { min-width: 0; }
    .user-chip b, .user-chip span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-chip b { color: #fff4f3; font-size: 12px; }
    .user-chip span { color: #d8a7a5; font-size: 11px; margin-top: 2px; }
    .signout { background: transparent; border: 0; color: #dfb9b7; padding: 0; font-size: 12px; }
    .signout:hover { color: #fff; }

    /* ---------- Main / topbar ---------- */
    .main { margin-left: var(--sidebar); flex: 1; min-width: 0; }
    .topbar {
      height: 73px; padding: 0 34px; background: rgba(255, 252, 251, .86); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 16px; position: sticky; top: 0; z-index: 10; backdrop-filter: blur(14px);
    }
    .topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, #b71c1c 0%, #e53935 30%, rgba(229, 57, 53, 0) 78%); }
    .topbar h1 { margin: 0; font-size: 20px; letter-spacing: -.025em; }
    .topbar p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .page { padding: 30px 34px 60px; }
    .eyebrow {
      display: inline-block; color: var(--brand); font-size: 12px; font-weight: 650; margin-bottom: 10px;
      background: var(--g-soft); border: 1px solid var(--brand-soft-2); border-radius: 99px; padding: 4px 11px;
    }
    .page-title {
      margin: 0; font-size: 29px; letter-spacing: -.04em; line-height: 1.2; font-weight: 750; width: fit-content; max-width: 100%;
      background: var(--g-text); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    }
    .page-subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .header-row { display: flex; justify-content: space-between; gap: 18px; align-items: end; margin-bottom: 26px; }

    /* Dải chào mừng ở Tổng quan — điểm nhấn gradient lớn nhất của app */
    .header-row.hero {
      position: relative; overflow: hidden; align-items: center; padding: 30px 32px; border-radius: 24px; margin-bottom: 24px;
      background:
        radial-gradient(420px 260px at 88% -20%, rgba(255, 200, 87, .38), transparent 65%),
        radial-gradient(360px 260px at 8% 130%, rgba(255, 110, 96, .40), transparent 65%),
        linear-gradient(118deg, #c62828 0%, #a11318 42%, #5e0c12 100%);
      box-shadow: 0 22px 46px rgba(140, 18, 24, .30), inset 0 1px 0 rgba(255, 255, 255, .18);
    }
    .header-row.hero::after {
      content: ""; position: absolute; right: -60px; bottom: -110px; width: 320px; height: 320px; border-radius: 50%; pointer-events: none;
      border: 1px solid rgba(255, 255, 255, .16); box-shadow: 0 0 0 38px rgba(255, 255, 255, .035), 0 0 0 78px rgba(255, 255, 255, .025);
    }
    .header-row.hero > * { position: relative; z-index: 1; }
    .hero .eyebrow { background: rgba(255, 255, 255, .13); border-color: rgba(255, 255, 255, .22); color: #ffdca0; }
    .hero .page-title { background: none; -webkit-text-fill-color: #fff; color: #fff; }
    .hero .page-subtitle { color: rgba(255, 236, 234, .82); }

    .actions { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; gap: 8px; align-items: center; justify-content: center; border: 1px solid transparent;
      border-radius: 11px; padding: 10px 16px; font-size: 13px; font-weight: 650; transition: .2s ease; white-space: nowrap;
    }
    .btn svg { width: 16px; height: 16px; }
    .btn-primary {
      color: #fff; background: var(--g-brand); background-size: 140% 140%; background-position: 0 50%;
      box-shadow: 0 8px 20px rgba(183, 28, 28, .30), inset 0 1px 0 rgba(255, 255, 255, .22);
    }
    .btn-primary:hover { background: var(--g-brand-hover); transform: translateY(-1px); box-shadow: 0 12px 26px rgba(183, 28, 28, .38), inset 0 1px 0 rgba(255, 255, 255, .28); }
    .btn-primary:active { transform: translateY(0); box-shadow: 0 4px 10px rgba(183, 28, 28, .3); }
    .btn-light { color: #8e1216; background: linear-gradient(180deg, #fff, #ffeceb); box-shadow: 0 8px 22px rgba(0, 0, 0, .22); }
    .btn-light:hover { background: #fff; transform: translateY(-1px); }
    .btn-secondary { background: linear-gradient(180deg, #fff, #fff8f7); color: var(--ink-2); border-color: var(--line-strong); }
    .btn-secondary:hover { background: var(--g-soft); border-color: #dc8985; color: var(--brand-dark); }
    .btn-danger { background: linear-gradient(180deg, #fff5f4, #ffe4e2); color: var(--danger); border-color: #f0b3b0; }
    .btn-danger:hover { background: linear-gradient(135deg, #a31515, #6b0d10); color: #fff; border-color: transparent; }
    .btn-plain { background: transparent; color: var(--muted); border: 0; padding: 6px; border-radius: 9px; }
    .btn-plain:hover { background: var(--brand-soft); color: var(--brand); }
    .btn:disabled { cursor: not-allowed; opacity: .55; transform: none; }

    /* ---------- Cards ---------- */
    .grid-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 22px; }
    .stat-card, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-card); }
    .stat-card { --a: #e53935; --b: #a51218; padding: 20px 18px 18px; position: relative; overflow: hidden; }
    .stat-card:nth-child(2) { --a: #f4511e; --b: #b23a0c; }
    .stat-card:nth-child(3) { --a: #d81b60; --b: #7c0b45; }
    .stat-card:nth-child(4) { --a: #d97706; --b: #a8410a; }
    .stat-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--a), var(--b)); }
    .stat-card::after { content: ""; position: absolute; width: 96px; height: 96px; border-radius: 50%; right: -28px; top: -34px; background: linear-gradient(135deg, var(--a), var(--b)); opacity: .13; }
    .stat-label { color: var(--muted); font-size: 12px; font-weight: 600; position: relative; z-index: 1; }
    .stat-value {
      font-size: 30px; font-weight: 750; letter-spacing: -.04em; margin-top: 10px; position: relative; z-index: 1; font-variant-numeric: tabular-nums;
      width: fit-content; max-width: 100%;
      background: linear-gradient(120deg, var(--a), var(--b)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    }
    .stat-note { color: #a08b8d; font-size: 11px; margin-top: 4px; position: relative; z-index: 1; }
    .panel { overflow: hidden; }
    .panel-head {
      padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px;
      background: linear-gradient(180deg, #fffdfd, #fff7f6);
    }
    .panel-head h2 { margin: 0; font-size: 15px; letter-spacing: -.015em; display: flex; align-items: center; gap: 9px; }
    .panel-head h2::before { content: ""; width: 4px; height: 16px; border-radius: 4px; background: linear-gradient(180deg, #e53935, #8e1216); flex: 0 0 auto; }
    .panel-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .panel-body { padding: 20px; }

    /* ---------- Tables ---------- */
    .table-wrap { width: 100%; overflow: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 820px; }
    th, td { padding: 11px 16px; border-bottom: 1px solid #f7e9e8; text-align: left; font-size: 12px; vertical-align: middle; white-space: nowrap; font-variant-numeric: tabular-nums; }
    th {
      color: #7f2a2c; font-size: 11.5px; font-weight: 700; letter-spacing: .01em; position: sticky; top: 0; z-index: 1;
      background: linear-gradient(180deg, #fff6f5, #fdeae8); border-bottom: 1px solid var(--line-strong);
    }
    td { color: var(--ink-2); }
    tr:hover td { background: linear-gradient(90deg, #fff1f0, #fffafa); }
    td strong { color: var(--ink); font-size: 12px; }
    tbody tr:last-child td { border-bottom: 0; }

    /* ---------- Badges / notices ---------- */
    .badge { display: inline-flex; align-items: center; border-radius: 99px; padding: 4px 10px; font-size: 10.5px; font-weight: 700; border: 1px solid transparent; }
    .badge-success { background: linear-gradient(135deg, #e9f9f1, #d2f1e2); color: var(--success); border-color: #b6e5cf; }
    .badge-warning { background: linear-gradient(135deg, #fff6e6, #ffe8c2); color: var(--warning); border-color: #f6d7a0; }
    .badge-danger { background: linear-gradient(135deg, #ffeeed, #ffd6d3); color: var(--danger); border-color: #f5b7b3; }
    .badge-blue { background: linear-gradient(135deg, #fff0ef, #fbd3cf); color: var(--brand); border-color: #f2b7b2; }
    .notice { border-radius: 12px; padding: 12px 14px; font-size: 12px; line-height: 1.55; border-left: 3px solid transparent; }
    .notice-info { background: linear-gradient(100deg, #fff1f0, #fff8f7); color: #7a1418; border-left-color: var(--brand); }
    .notice-warning { background: linear-gradient(100deg, #fff3df, #fffaf1); color: #8a3d05; border-left-color: #f59e0b; }
    .notice-danger { background: linear-gradient(100deg, #ffe4e2, #fff3f2); color: #7d1212; border-left-color: #8e1216; }

    /* ---------- Toolbar / inputs ---------- */
    .toolbar { padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #fff, #fffafa); }
    .search { width: min(320px, 100%); position: relative; }
    .search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--line-strong); border-radius: 11px; outline: none; color: var(--ink); background: #fff; font-size: 12px; transition: .18s; }
    .search input:focus, .field input:focus, .field select:focus, .field textarea:focus, .role-select:focus {
      border-color: #dd5a55; box-shadow: 0 0 0 4px rgba(229, 57, 53, .13);
    }
    .search svg { position: absolute; left: 12px; top: 10px; color: #c98c89; width: 16px; }
    .role-select { border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 8px; font-size: 11px; background: #fff; color: var(--ink-2); outline: none; }
    .role-select:disabled { background: #faf3f2; color: #a08b8d; cursor: not-allowed; }
    .empty { text-align: center; padding: 44px 20px; color: var(--muted); background: radial-gradient(260px 140px at 50% 0%, rgba(229, 57, 53, .06), transparent 70%); }
    .empty strong { display: block; color: var(--ink); font-size: 14px; margin-bottom: 6px; }
    .two-col { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; }
    .two-col .table-wrap table { min-width: 0; }

    /* ---------- Import ---------- */
    .import-drop {
      border: 1.5px dashed #dc9591; border-radius: 16px; padding: 30px; text-align: center; transition: .2s;
      background: linear-gradient(160deg, #fffdfd 0%, #fff1f0 100%);
    }
    .import-drop.drag { border-color: var(--brand); background: linear-gradient(160deg, #ffe6e4 0%, #ffc9c5 100%); box-shadow: 0 0 0 5px rgba(229, 57, 53, .10); }
    .import-drop > svg {
      width: 62px; height: 62px; padding: 16px; border-radius: 20px; color: #fff;
      background: var(--g-brand); box-shadow: 0 12px 26px rgba(183, 28, 28, .32), inset 0 1px 0 rgba(255, 255, 255, .28);
    }
    .import-drop h3 { margin: 14px 0 6px; font-size: 15px; }
    .import-drop p { margin: 0 auto 16px; color: var(--muted); font-size: 12px; max-width: 430px; line-height: 1.6; }
    .setup-code { background: var(--g-deep); color: #f0d4d2; border-radius: 12px; padding: 14px; font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 230px; overflow: auto; white-space: pre-wrap; }
    .table-list { display: grid; gap: 10px; }
    .table-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(180deg, #fff, #fffafa); transition: .18s; }
    .table-item b { font-size: 12px; display: block; }
    .table-item span { color: var(--muted); font-size: 11px; display: block; margin-top: 3px; }
    button.table-item { width: 100%; color: inherit; text-align: left; }
    button.table-item:hover { border-color: #e29a96; background: linear-gradient(90deg, #fff1f0, #fff); box-shadow: 0 8px 22px rgba(183, 28, 28, .10); }
    .table-item .go {
      margin: 0; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto;
      background: var(--g-brand); color: #fff; font-size: 14px; box-shadow: 0 5px 12px rgba(183, 28, 28, .28);
    }

    /* ---------- Modal ---------- */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(38, 7, 10, .62); backdrop-filter: blur(5px); display: grid; place-items: center; padding: 20px; z-index: 50; }
    .modal { background: #fff; border-radius: 22px; width: min(630px, 100%); max-height: min(800px, 92vh); overflow: auto; box-shadow: 0 30px 90px rgba(60, 8, 12, .40); }
    .modal-head { padding: 22px 22px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: relative; background: linear-gradient(180deg, #fff4f3, #fff); }
    .modal-head::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: linear-gradient(90deg, #e53935, #b71c1c 55%, #5e0c12); }
    .modal-head h2 { margin: 0; font-size: 17px; }
    .modal-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .modal-body { padding: 21px 22px; }
    .modal-foot { padding: 14px 22px 20px; display: flex; justify-content: flex-end; gap: 9px; background: linear-gradient(180deg, #fff, #fff8f7); border-top: 1px solid var(--line); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 11.5px; color: var(--ink-2); font-weight: 650; }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 11px; outline: none; color: var(--ink); font-size: 12px; background: #fff; transition: .18s; }
    .field textarea { min-height: 82px; resize: vertical; }

    /* ---------- Toast ---------- */
    .toast-wrap { position: fixed; right: 22px; bottom: 22px; z-index: 100; display: grid; gap: 9px; width: min(370px, calc(100vw - 44px)); }
    .toast { background: linear-gradient(135deg, #3f2124, #1f0f11); color: #fff; border-radius: 13px; padding: 13px 15px; font-size: 12px; box-shadow: var(--shadow); border-left: 4px solid var(--gold); animation: pop .2s ease both; }
    .toast.error { background: linear-gradient(135deg, #b3181d, #6b0d10); border-left-color: #ffb4ac; }
    .toast.success { background: linear-gradient(135deg, #10935f, #075d3b); border-left-color: #a7f3d0; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .loading { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; }
    .spinner { width: 16px; height: 16px; border: 2px solid #f0cfcc; border-top-color: var(--brand); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mobile-menu { display: none; border: 1px solid var(--line-strong); background: var(--g-soft); color: var(--brand); padding: 7px; border-radius: 11px; }
    .mobile-menu svg { width: 20px; height: 20px; }
    .pill-tabs { display: flex; gap: 5px; background: #fbeceb; padding: 4px; border-radius: 11px; }
    .pill-tabs button { border: 0; background: transparent; color: var(--muted); padding: 7px 10px; border-radius: 8px; font-size: 11px; }
    .pill-tabs button.active { background: #fff; color: var(--brand); box-shadow: 0 2px 8px rgba(183, 28, 28, .14); font-weight: 700; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1050px) { .grid-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .two-col { grid-template-columns: 1fr; } }
    @media (max-width: 760px) {
      :root { --sidebar: 0px; }
      .sidebar { transform: translateX(-100%); transition: transform .2s; width: 262px; }
      .sidebar.open { transform: translateX(0); box-shadow: 14px 0 44px rgba(30, 4, 7, .35); }
      .mobile-menu { display: inline-grid; place-items: center; }
      .topbar { padding: 0 17px; height: 64px; }
      .topbar h1 { font-size: 17px; }
      .topbar p { display: none; }
      .page { padding: 22px 16px 46px; }
      .header-row { align-items: flex-start; flex-direction: column; margin-bottom: 20px; }
      .header-row.hero { padding: 24px 20px; align-items: flex-start; border-radius: 20px; }
      .page-title { font-size: 25px; }
      .grid-stats { gap: 10px; }
      .stat-card { padding: 16px 14px 14px; }
      .stat-value { font-size: 23px; }
      .panel-head, .panel-body { padding: 15px; }
      .toolbar { padding: 12px 15px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

    /* =====================================================================
       Auth screens — đăng nhập / chờ duyệt / loading
       Một lớp nền "aurora" cố định nằm ngoài #root nên khi chuyển giữa các màn hình
       nền không bị chạy lại, chỉ phần nội dung chuyển cảnh.
       ===================================================================== */
    :root { --ease: cubic-bezier(.22, 1, .36, 1); --ease-io: cubic-bezier(.65, 0, .35, 1); }
    #root { position: relative; z-index: 1; }
    body.auth { background: #36070b; }

    .aurora {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
      background: linear-gradient(140deg, #c62828 0%, #8e1216 46%, #36070b 100%);
      opacity: 0; visibility: hidden; transition: opacity .5s ease, visibility 0s .5s;
    }
    body.auth .aurora { opacity: 1; visibility: visible; transition: opacity .5s ease; }
    .aurora .blob { position: absolute; border-radius: 50%; will-change: transform; }
    .aurora .b1 { width: 62vmax; height: 62vmax; left: -20vmax; top: -26vmax; background: radial-gradient(circle, rgba(255, 122, 107, .62), transparent 62%); animation: drift-a 22s ease-in-out infinite alternate; }
    .aurora .b2 { width: 58vmax; height: 58vmax; right: -22vmax; bottom: -28vmax; background: radial-gradient(circle, rgba(240, 84, 72, .52), transparent 62%); animation: drift-b 27s ease-in-out infinite alternate; }
    .aurora .b3 { width: 34vmax; height: 34vmax; left: 34%; top: 26%; background: radial-gradient(circle, rgba(255, 168, 120, .26), transparent 66%); animation: drift-c 31s ease-in-out infinite alternate; }
    .aurora .grid {
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, .055) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .055) 1px, transparent 1px);
      background-size: 46px 46px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 45%, #000 0%, transparent 72%); mask-image: radial-gradient(ellipse at 50% 45%, #000 0%, transparent 72%);
    }
    @keyframes drift-a { to { transform: translate3d(16vmax, 12vmax, 0) scale(1.14); } }
    @keyframes drift-b { to { transform: translate3d(-14vmax, -10vmax, 0) scale(1.1); } }
    @keyframes drift-c { to { transform: translate3d(-12vmax, 10vmax, 0) scale(1.25); } }

    /* Trình tự xuất hiện: chỉ chạy một lần khi vào màn hình (class is-entering) */
    .is-entering .rv { animation: rise .8s var(--ease) backwards; animation-delay: calc(var(--d, 0) * 1ms); }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
    @keyframes fade-in { from { opacity: 0; } }
    @keyframes panel-in { from { opacity: 0; transform: translateX(56px); } }
    @keyframes panel-in-up { from { opacity: 0; transform: translateY(48px); } }
    @keyframes card-in { from { opacity: 0; transform: translateY(30px) scale(.95); } }
    @keyframes row-in { from { opacity: 0; transform: translateX(-16px); } }
    @keyframes chip-in { from { opacity: 0; transform: scale(.7) translateY(10px); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes pop-in { from { opacity: 0; transform: scale(.94); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* ---------- Đăng nhập: chia đôi ---------- */
    .auth-split {
      /* Cụm nội dung nằm giữa màn hình: cột trái (giới thiệu) + thẻ đăng nhập nổi bên phải */
      min-height: 100vh; display: grid; align-items: center; justify-content: center;
      grid-template-columns: minmax(0, 500px) minmax(0, clamp(400px, 38vw, 440px));
      column-gap: clamp(48px, 6vw, 96px);
      width: min(1120px, calc(100% - 2 * clamp(24px, 5vw, 72px))); margin: 0 auto; padding: 48px 0;
    }
    .auth-showcase { position: relative; display: flex; flex-direction: column; gap: 28px; color: #fff; }
    .auth-brand { display: none; align-items: center; gap: 12px; }
    .auth-brand strong { font-size: 16px; letter-spacing: -.02em; }
    .auth-brand small { display: block; color: rgba(255, 225, 222, .74); font-size: 11px; margin-top: 3px; }
    .auth-stage { display: grid; gap: 40px; }
    .showcase-copy { max-width: 100%; }
    .showcase-copy h2 { margin: 0; font-size: clamp(28px, 2.9vw, 42px); line-height: 1.14; letter-spacing: -.04em; font-weight: 750; text-wrap: balance; }
    .showcase-copy p { margin: 16px 0 0; font-size: 15px; line-height: 1.7; color: rgba(255, 232, 229, .84); max-width: 440px; }

    .preview-wrap { position: relative; width: min(470px, 100%); }
    .preview {
      border-radius: 24px; padding: 18px 16px 10px;
      background: linear-gradient(160deg, rgba(255, 255, 255, .21), rgba(255, 255, 255, .07));
      border: 1px solid rgba(255, 255, 255, .26); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      box-shadow: 0 32px 74px rgba(20, 2, 5, .42), inset 0 1px 0 rgba(255, 255, 255, .36);
    }
    .pv-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 6px 12px; font-size: 13px; font-weight: 650; }
    .pv-search { width: 118px; height: 26px; border-radius: 99px; background: rgba(255, 255, 255, .13); border: 1px solid rgba(255, 255, 255, .2); }
    .pv-rows { position: relative; }
    .pv-row { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 10px; border-radius: 13px; position: relative; }
    .pv-row + .pv-row::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 1px; background: rgba(255, 255, 255, .11); }
    .pv-ava { width: 30px; height: 30px; border-radius: 50%; flex: none; background: linear-gradient(135deg, var(--h1), var(--h2)); box-shadow: 0 0 0 2px rgba(255, 255, 255, .22); }
    .pv-lines { flex: 1; display: grid; gap: 6px; }
    .pv-lines i { display: block; height: 7px; border-radius: 99px; background: rgba(255, 255, 255, .36); }
    .pv-lines i:last-child { height: 6px; width: 52%; background: rgba(255, 255, 255, .17); }
    .pv-role { font-size: 10.5px; font-weight: 650; padding: 4px 10px; border-radius: 99px; background: rgba(255, 255, 255, .15); border: 1px solid rgba(255, 255, 255, .24); }
    .pv-scan {
      position: absolute; left: 0; right: 0; top: 0; height: 52px; border-radius: 13px; pointer-events: none; opacity: 0;
      background: linear-gradient(90deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, .05));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .3);
      animation: scan 9s var(--ease-io) 2.4s infinite both;
    }
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0; }
      5%, 12% { transform: translateY(0); opacity: 1; }
      18%, 30% { transform: translateY(52px); }
      36%, 48% { transform: translateY(104px); }
      54%, 66% { transform: translateY(156px); }
      72%, 84% { transform: translateY(208px); opacity: 1; }
      100% { transform: translateY(208px); opacity: 0; }
    }
    .pv-chip {
      position: absolute; display: flex; align-items: center; gap: 9px; padding: 9px 14px 9px 10px; border-radius: 15px; white-space: nowrap;
      font-size: 12px; font-weight: 650; color: var(--ink); background: rgba(255, 255, 255, .97); box-shadow: 0 18px 38px rgba(20, 2, 5, .36);
      animation: float 6.5s ease-in-out infinite;
    }
    .pv-chip.c1 { right: -20px; top: -22px; }
    .pv-chip.c2 { left: 34px; bottom: -32px; animation-duration: 7.5s; animation-delay: -2.5s; }
    .chip-ico { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: var(--g-brand); box-shadow: 0 4px 10px rgba(183, 28, 28, .3); }
    .chip-ico svg { width: 13px; height: 13px; }
    .is-entering .preview { animation: card-in .95s var(--ease) .5s backwards; }
    .is-entering .pv-row { animation: row-in .65s var(--ease) backwards; animation-delay: calc(.95s + var(--i) * 90ms); }
    .is-entering .pv-chip.c1 { animation: chip-in .7s var(--ease) 1.5s backwards, float 6.5s ease-in-out 2.2s infinite; }
    .is-entering .pv-chip.c2 { animation: chip-in .7s var(--ease) 1.7s backwards, float 7.5s ease-in-out 2.4s infinite; }

    .auth-form-side {
      position: relative; overflow: hidden; padding: 28px 34px 34px;
      background: radial-gradient(420px 320px at 100% 0%, rgba(229, 57, 53, .10), transparent 70%), linear-gradient(180deg, #fff 0%, #fff8f7 100%);
      border-radius: 28px; border: 1px solid rgba(255, 255, 255, .75);
      box-shadow: 0 44px 96px rgba(20, 2, 5, .46), 0 0 0 6px rgba(255, 255, 255, .08);
    }
    .card-brand { display: flex; align-items: center; gap: 12px; padding-bottom: 20px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
    .card-brand strong { display: block; font-size: 15px; letter-spacing: -.02em; color: var(--ink); }
    .card-brand small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .card-badge { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 99px; font-size: 11px; font-weight: 650; color: var(--brand); background: var(--g-soft); border: 1px solid var(--brand-soft-2); white-space: nowrap; }
    .card-badge svg { width: 12px; height: 12px; }
    .is-entering .auth-form-side { animation: panel-in .95s var(--ease) backwards; }
    .auth-form { width: 100%; margin: 0; }
    .auth-form h1 {
      margin: 0; font-size: 31px; line-height: 1.15; letter-spacing: -.04em; font-weight: 750; width: fit-content; max-width: 100%;
      background: var(--g-text); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    }
    .auth-form > p { color: var(--muted); line-height: 1.7; font-size: 13.5px; margin: 12px 0 28px; }

    .google-btn {
      position: relative; overflow: hidden; width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px;
      border: 0; border-radius: 15px; padding: 13px 18px; color: #fff; font-weight: 700; font-size: 14.5px; cursor: pointer;
      background: var(--g-brand);
      box-shadow: 0 14px 30px rgba(183, 28, 28, .34), inset 0 1px 0 rgba(255, 255, 255, .26);
      transition: transform .3s var(--ease), box-shadow .3s var(--ease), background .3s;
    }
    .google-btn::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; transform: translateX(-120%);
      background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .34) 50%, transparent 65%);
    }
    .google-btn:hover:not(:disabled) { background: var(--g-brand-hover); transform: translateY(-2px); box-shadow: 0 22px 40px rgba(183, 28, 28, .42), inset 0 1px 0 rgba(255, 255, 255, .3); }
    .google-btn:hover:not(:disabled)::after { transform: translateX(120%); transition: transform .85s var(--ease); }
    .google-btn:active:not(:disabled) { transform: translateY(0) scale(.985); box-shadow: 0 8px 18px rgba(183, 28, 28, .3); }
    .google-btn:disabled { cursor: progress; }
    .g-chip { position: relative; width: 30px; height: 30px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 3px 8px rgba(60, 8, 12, .28); }
    .google-icon { width: 18px; height: 18px; transition: transform .35s var(--ease), opacity .2s; }
    .google-btn:hover:not(:disabled) .google-icon { transform: scale(1.12); }
    .g-spin { position: absolute; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #f0cfcc; border-top-color: var(--brand); animation: spin .7s linear infinite; opacity: 0; transition: opacity .2s; }
    .google-btn.is-loading .google-icon { opacity: 0; transform: scale(.5); }
    .google-btn.is-loading .g-spin { opacity: 1; }

    .flow { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); }
    .flow-title { font-size: 12.5px; font-weight: 650; color: var(--ink-2); margin-bottom: 16px; }
    .flow-list { list-style: none; margin: 0; padding: 0; }
    .flow-item { position: relative; display: flex; gap: 14px; padding-bottom: 18px; }
    .flow-item:last-child { padding-bottom: 0; }
    .flow-item:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 30px; bottom: 2px; width: 2px; border-radius: 2px; background: linear-gradient(180deg, var(--brand-soft-2), rgba(251, 213, 210, .2)); }
    .flow-num { position: relative; z-index: 1; width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; color: var(--brand); background: var(--g-soft); border: 1px solid var(--brand-soft-2); }
    .flow-item b { display: block; font-size: 12.5px; color: var(--ink); line-height: 28px; }
    .flow-item small { display: block; font-size: 12px; color: var(--muted); line-height: 1.55; margin-top: -3px; }

    /* ---------- Chờ duyệt / loading ---------- */
    .auth-center { min-height: 100vh; display: grid; place-items: center; padding: 28px 20px; }
    .pending-card {
      position: relative; overflow: hidden; width: min(480px, 100%); text-align: center; padding: 42px 36px 30px; border-radius: 30px;
      background: linear-gradient(180deg, #fff 0%, #fff8f7 100%);
      box-shadow: 0 44px 110px rgba(20, 2, 5, .52), 0 0 0 1px rgba(255, 255, 255, .5);
    }
    .pending-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, #ff7a6b, #e53935 35%, #b71c1c 65%, #5e0c12); }
    .is-entering .pending-card { animation: card-in .9s var(--ease) backwards; }

    .status-orb { position: relative; width: 86px; height: 86px; margin: 0 auto 22px; display: grid; place-items: center; }
    .status-orb::before, .status-orb::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 2px solid rgba(245, 158, 11, .55); animation: ring 2.8s ease-out infinite; }
    .status-orb::after { animation-delay: 1.4s; }
    @keyframes ring { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
    .status-orb .core {
      position: relative; z-index: 1; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; color: #8a4b05;
      background: linear-gradient(135deg, #ffe4ae, #ffb04a);
      box-shadow: 0 16px 34px rgba(217, 119, 6, .36), inset 0 1px 0 rgba(255, 255, 255, .65);
    }
    .status-orb svg { width: 34px; height: 34px; }
    .status-orb.is-rejected::before, .status-orb.is-rejected::after { display: none; }
    .status-orb.is-rejected .core { color: #8e1216; background: linear-gradient(135deg, #ffd3cf, #ff8f88); box-shadow: 0 16px 34px rgba(183, 28, 28, .32), inset 0 1px 0 rgba(255, 255, 255, .6); }
    .hand-h, .hand-m { transform-box: view-box; transform-origin: 12px 12px; animation: spin 24s linear infinite; }
    .hand-m { animation-duration: 3s; }
    .pending-card h2 { margin: 0; font-size: 22px; letter-spacing: -.03em; font-weight: 750; }
    .pending-card > p, .pending-card .rv > p { color: var(--muted); font-size: 13.5px; line-height: 1.7; margin: 10px auto 0; max-width: 380px; }

    .steps { list-style: none; margin: 28px 0 22px; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); }
    .step { position: relative; display: grid; justify-items: center; align-content: start; gap: 10px; padding: 0 4px; font-size: 11.5px; font-weight: 600; line-height: 1.35; color: var(--muted); }
    .step .dot {
      position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700;
      color: #b69a9c; background: #fff; border: 2px solid var(--line-strong);
    }
    .step:not(:last-child)::after {
      content: ""; position: absolute; top: 14px; left: calc(50% + 21px); width: calc(100% - 42px); height: 2px; border-radius: 2px;
      background-image: linear-gradient(90deg, var(--line-strong) 6px, transparent 6px); background-size: 11px 2px;
    }
    .step.done { color: #0b7a4f; }
    .step.done .dot { color: #fff; border-color: transparent; background: linear-gradient(135deg, #17b978, #0a7048); box-shadow: 0 6px 14px rgba(11, 122, 79, .3); }
    .step.done .dot svg { width: 15px; height: 15px; stroke-width: 2.6; }
    .step.done::after { background-image: none; background: linear-gradient(90deg, #17b978, #e53935); transform-origin: left; }
    .is-entering .step.done::after { animation: line-fill .9s var(--ease) .8s backwards; }
    @keyframes line-fill { from { transform: scaleX(0); } }
    .step.current { color: var(--brand); font-weight: 700; }
    .step.current .dot { border-color: var(--brand-light); }
    .step.current::after { animation: march 1.1s linear infinite; }
    @keyframes march { to { background-position-x: 11px; } }
    .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--g-brand); animation: pulse 1.9s ease-out infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(229, 57, 53, .55); } 75%, 100% { box-shadow: 0 0 0 10px rgba(229, 57, 53, 0); } }
    .step.fail { color: var(--danger); font-weight: 700; }
    .step.fail .dot { color: #fff; border-color: transparent; background: linear-gradient(135deg, #e53935, #8e1216); box-shadow: 0 6px 14px rgba(183, 28, 28, .3); }
    .step.fail .dot svg { width: 14px; height: 14px; stroke-width: 2.6; }

    .account { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border-radius: 16px; background: linear-gradient(100deg, #fff1f0, #fff8f7); border: 1px solid var(--brand-soft-2); }
    .account .avatar { width: 38px; height: 38px; font-size: 13px; }
    .account-info { flex: 1; min-width: 0; }
    .account-info b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .account-info small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .live { display: flex; align-items: center; justify-content: center; gap: 9px; margin: 16px 0 20px; font-size: 12px; color: var(--muted); }
    .live i { width: 8px; height: 8px; border-radius: 50%; background: #10a06a; animation: live 1.9s ease-out infinite; }
    @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(16, 160, 106, .55); } 75%, 100% { box-shadow: 0 0 0 8px rgba(16, 160, 106, 0); } }
    .pending-actions { display: grid; gap: 10px; }
    .pending-card .account + .pending-actions { margin-top: 18px; }

    .loading-card { display: inline-flex; align-items: center; gap: 12px; padding: 16px 24px; border-radius: 18px; background: rgba(255, 255, 255, .97); color: var(--ink-2); font-size: 13px; font-weight: 600; box-shadow: 0 30px 70px rgba(20, 2, 5, .45); animation: fade-in .35s ease both; }

    /* ---------- Button system ---------- */
    .btn-primary { position: relative; overflow: hidden; }
    .btn-primary::after { content: ""; position: absolute; inset: 0; pointer-events: none; transform: translateX(-120%); background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .3) 50%, transparent 65%); }
    .btn-primary:hover:not(:disabled)::after { transform: translateX(120%); transition: transform .8s var(--ease); }
    .btn { transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .25s, border-color .25s, color .25s; }
    .btn:active:not(:disabled) { transform: translateY(0) scale(.985); }
    .btn-lg { padding: 14px 20px; font-size: 14px; border-radius: 15px; }
    .btn-lg svg { width: 18px; height: 18px; }
    .btn-block { width: 100%; }
    .btn-success { color: #fff; background: linear-gradient(135deg, #17b978 0%, #0b8a58 55%, #086b45 100%); box-shadow: 0 12px 26px rgba(11, 122, 79, .32), inset 0 1px 0 rgba(255, 255, 255, .25); }
    .btn-success:disabled { opacity: 1; cursor: default; }
    .btn.is-sent { animation: pop-in .45s var(--ease); }
    .btn.is-sent svg { stroke-width: 2.4; }
    .btn.is-sent svg path { stroke-dasharray: 26; stroke-dashoffset: 26; animation: draw .5s ease .15s forwards; }
    #send-request-btn svg { transition: transform .3s var(--ease); }
    #send-request-btn:hover:not(:disabled) svg { transform: translate(2px, -2px); }
    #logout-pending svg { transition: transform .3s var(--ease); }
    #logout-pending:hover svg { transform: translateX(3px); }

    /* Màn hình vừa (laptop nhỏ / tablet ngang): bỏ phần minh hoạ, giữ thẻ đăng nhập thoáng */
    @media (min-width: 961px) and (max-width: 1180px) {
      .auth-split { grid-template-columns: minmax(0, 400px) minmax(0, 420px); }
      .preview-wrap, .card-badge { display: none; }

    const DMS_FIELDS = [

      ["username", "UserName", true], ["password_expiry_date", "PasswordExpiryDate"], ["description", "Description"],
      ["employee_code", "EmployeeCode"], ["employee_name", "EmployeeName"], ["date_of_birth", "DateOfBirth"],
      ["date_of_joining", "DateOfJoining"], ["email", "Email"], ["role_name", "RoleName"],
      ["territory_hierarchy", "TerritoryHierarchy"], ["last_login_time", "LastLoginTime"],
      ["created_datetime", "CreatedDateTime"], ["modified_datetime", "ModifiedDateTime"], ["is_active", "IsActive"]
    ];

    const state = {
      supabase: null, session: null, profile: null, tab: "dashboard", dataset: "dms",
      dms: [], central: [], profiles: [], logs: [], counts: { dms: 0, central: 0, pending: 0 },
      search: "", loading: false, requestSent: false
    };
    let profileChannel = null;
    let adminChannel = null;

    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));

    const roleLabel = (role) => ({ "super-admin": "Super-admin", "senior-member": "Senior-member", member: "Member" }[role] || role);

    const initials = (name) => String(name || "U").split(/[\s@]+/).filter(Boolean).slice(0, 2).map(x => x[0]).join("").toUpperCase();
    const formatDate = (value) => value ? new Date(value).toLocaleString("vi-VN", { dateStyle: "medium", timeStyle: "short" }) : "—";

    function toast(message, type = "") {
      const node = document.createElement("div");
      node.className = `toast ${type}`; node.textContent = message; $("#toast-root").appendChild(node);
      setTimeout(() => node.remove(), 4200);
    }

    function setLoading(value) {
      state.loading = value;
      const el = document.querySelector("[data-loading]");
      if (el) el.classList.toggle("hidden", !value);
    }

    let lastScreen = null;
    function render() {
      const root = $("#root");
      let screen;
      if (state.booting) screen = "loading";            // đang khôi phục phiên đăng nhập → tránh chớp màn hình login
      else if (!state.session) screen = "login";
      else if (!state.profile) screen = "loading";
      else if (state.profile.approval_status !== "approved") screen = "pending";
      else screen = "app";
      const entering = screen !== lastScreen;             // chỉ chạy animation xuất hiện khi mới vào màn hình
      document.body.classList.toggle("auth", screen !== "app");
      if ((screen === "login" || screen === "loading") && !entering) return; // giữ nguyên DOM để animation không bị chạy lại
      lastScreen = screen;
      if (screen === "login") root.innerHTML = renderLogin(entering);
      else if (screen === "loading") root.innerHTML = renderLoadingState();
      else if (screen === "pending") root.innerHTML = renderPending(entering);
      else { root.innerHTML = renderApp(); bindAppEvents(); }

              <div class="pv-chip c2"><span class="chip-ico">${ICONS.users}</span>Phân quyền theo vai trò</div>

          </div>

        <section class="auth-form-side"><div class="auth-form">

      const tabs = [

        </div>
        <div class="two-col">

            <button class="table-item" data-tab="central"><div><b>Central User list</b><span>${state.counts.central.toLocaleString("vi-VN")} người dùng • khóa UserName</span></div><span class="go">→</span></button>
          </div></section>
          <section class="panel"><div class="panel-head"><div><h2>Lịch sử import</h2><p>Những lần cập nhật gần nhất.</p></div></div>${recent.length ? `<div class="table-wrap"><table><thead><tr><th>File</th><th>Thời gian</th><th>Trạng thái</th></tr></thead><tbody>${recent.map(log => `<tr><td><strong>${escapeHtml(log.file_name)}</strong></td><td>${formatDate(log.created_at)}</td><td>${log.status === "success" ? '<span class="badge badge-success">Thành công</span>' : '<span class="badge badge-danger">Lỗi</span>'}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty"><strong>Chưa có lịch sử import</strong>Chỉ Super-admin mới có thể nạp file masterdata.</div>`}</section>
        </div>`;
    }

    function renderDataset() {
      const isDms = state.tab === "dms"; state.dataset = isDms ? "dms" : "central";
      const fields = isDms ? DMS_FIELDS : CENTRAL_FIELDS;
      const rows = state[isDms ? "dms" : "central"];
      const filtered = rows.filter(row => !state.search || Object.values(row).some(v => String(v ?? "").toLowerCase().includes(state.search.toLowerCase()))).slice(0, 500);
      return `<div class="header-row"><div><div class="eyebrow">${isDms ? "DMS directory" : "Central directory"}</div><h2 class="page-title">${isDms ? "DMS Userlist" : "Central User list"}</h2><p class="page-subtitle">${isDms ? "Danh sách người dùng DMS theo tenant, vùng và trạng thái." : "Danh sách nhân sự Central và thông tin hoạt động."}</p></div><div class="actions">${canEdit() ? `<button class="btn btn-primary" id="new-row">${ICONS.plus} Thêm bản ghi</button>` : ""}</div></div>
        <section class="panel"><div class="toolbar"><div class="search">${ICONS.search}<input id="table-search" value="${escapeHtml(state.search)}" placeholder="Tìm theo tên, email, tenant…" /></div><div style="display:flex;gap:9px;align-items:center"><span class="badge badge-blue">${filtered.length}${rows.length > 500 ? "+": ""} / ${state.counts[isDms ? "dms" : "central"].toLocaleString("vi-VN")} dòng</span><button class="btn btn-secondary" id="refresh-data">${ICONS.refresh} Làm mới</button></div></div>
        ${filtered.length ? `<div class="table-wrap"><table><thead><tr>${fields.map(([, label]) => `<th>${escapeHtml(label)}</th>`).join("")}<th>Thao tác</th></tr></thead><tbody>${filtered.map(row => `<tr>${fields.map(([key]) => `<td>${key === "username" ? `<strong>${escapeHtml(row[key])}</strong>` : escapeHtml(row[key] || "—")}</td>`).join("")}<td><div style="display:flex;gap:4px">${canEdit() ? `<button class="btn btn-plain edit-row" data-key="${escapeHtml(row.username)}" title="Sửa">${ICONS.edit}</button>` : ""}${isAdmin() ? `<button class="btn btn-plain delete-row" data-key="${escapeHtml(row.username)}" title="Xóa" style="color:var(--danger)">${ICONS.trash}</button>` : ""}</div></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty"><strong>Không tìm thấy dữ liệu</strong>Thử đổi từ khóa tìm kiếm hoặc làm mới bảng.</div>`}</section>`;
    }

    function renderAdmin() {
      return `<div class="header-row"><div><div class="eyebrow">Super-admin console</div><h2 class="page-title">Quản lý dữ liệu</h2><p class="page-subtitle">Chỉ Super-admin nhìn thấy khu vực này.</p></div></div>
        <div class="two-col">
          <section class="panel"><div class="panel-head"><div><h2>Import masterdata</h2><p>Upsert theo UserName — bản ghi cũ được cập nhật, bản ghi mới được thêm.</p></div></div><div class="panel-body">
            <div class="import-drop" id="dropzone">${ICONS.upload}<h3>Kéo thả file Excel vào đây</h3><p>Hỗ trợ file .xlsx có hai sheet <b>DMS Userlist</b> và <b>Central User list</b>. Chỉ Super-admin được phép import.</p><label class="btn btn-primary" for="file-input">${ICONS.file} Chọn file Excel</label><input id="file-input" type="file" accept=".xlsx,.xls" class="hidden" /></div>
            <div id="import-status" style="margin-top:14px"></div>
          </div></section>
          <section class="panel"><div class="panel-head"><div><h2>Các bảng dữ liệu</h2><p>RLS bảo vệ quyền truy cập tại Supabase.</p></div></div><div class="panel-body"><div class="table-list">
            <div class="table-item"><div><b>profiles</b><span>${state.profiles.length} tài khoản • quyền và trạng thái duyệt</span></div><span class="badge badge-blue">Auth</span></div>
            <div class="table-item"><div><b>dms_users</b><span>${state.counts.dms.toLocaleString("vi-VN")} bản ghi • upsert UserName</span></div><span class="badge badge-success">RLS</span></div>
            <div class="table-item"><div><b>central_users</b><span>${state.counts.central.toLocaleString("vi-VN")} bản ghi • upsert UserName</span></div><span class="badge badge-success">RLS</span></div>
            <div class="table-item"><div><b>import_logs</b><span>${state.logs.length} lần import gần đây</span></div><span class="badge badge-success">RLS</span></div>
          </div></div></section>
        </div>
        <section class="panel" style="margin-top:18px"><div class="panel-head"><div><h2>Phê duyệt tài khoản</h2><p>Duyệt yêu cầu Gmail mới và cấp role.</p></div><span class="badge badge-warning">${state.counts.pending} chờ duyệt</span></div>${renderProfilesTable()}</section>
        <section class="panel" style="margin-top:18px"><div class="panel-head"><div><h2>Lịch sử import</h2><p>Audit log do Supabase lưu lại.</p></div></div>${renderLogsTable()}</section>`;
    }

    function renderProfilesTable() {
      if (!state.profiles.length) return `<div class="empty"><strong>Chưa có tài khoản nào</strong>Người dùng mới sẽ xuất hiện sau khi đăng nhập Google.</div>`;
      return `<div class="table-wrap"><table style="min-width:700px"><thead><tr><th>Tài khoản</th><th>Role</th><th>Trạng thái</th><th>Ngày đăng ký</th><th>Thao tác</th></tr></thead><tbody>${state.profiles.map(p => `<tr><td><strong>${escapeHtml(p.display_name || "—")}</strong><br><span style="font-size:11px;color:var(--muted)">${escapeHtml(p.email)}</span></td><td><select class="role-select" data-id="${p.id}"  ${p.id === state.profile.id ? "disabled" : ""}><option value="member" ${p.role === "member" ? "selected" : ""}>Member</option><option value="senior-member" ${p.role === "senior-member" ? "selected" : ""}>Senior-member</option><option value="super-admin" ${p.role === "super-admin" ? "selected" : ""}>Super-admin</option></select></td><td>${statusBadge(p.approval_status)}</td><td>${formatDate(p.created_at)}</td><td><div style="display:flex;gap:5px">${p.approval_status !== "approved" ? `<button class="btn btn-secondary approve-user" data-id="${p.id}">Duyệt</button>` : ""}${p.approval_status === "approved" && p.id !== state.profile.id ? `<button class="btn btn-danger reject-user" data-id="${p.id}">Thu hồi</button>` : ""}</div></td></tr>`).join("")}</tbody></table></div>`;
    }

    function renderLogsTable() {
      if (!state.logs.length) return `<div class="empty"><strong>Chưa có lịch sử</strong>Các lần import thành công và thất bại sẽ được lưu ở đây.</div>`;
      return `<div class="table-wrap"><table><thead><tr><th>File</th><th>DMS</th><th>Central</th><th>Người import</th><th>Thời gian</th><th>Trạng thái</th></tr></thead><tbody>${state.logs.map(l => `<tr><td><strong>${escapeHtml(l.file_name)}</strong></td><td>${l.dms_rows}</td><td>${l.central_rows}</td><td>${escapeHtml(l.imported_by || "—")}</td><td>${formatDate(l.created_at)}</td><td>${l.status === "success" ? '<span class="badge badge-success">Thành công</span>' : '<span class="badge badge-danger">Lỗi</span>'}</td></tr>`).join("")}</tbody></table></div>`;
    }

    function bindAppEvents() {
      document.querySelectorAll("[data-tab]").forEach(el => el.addEventListener("click", () => {
        state.tab = el.dataset.tab; state.search = ""; $("#sidebar")?.classList.remove("open"); render();
      }));
      $("#mobile-menu")?.addEventListener("click", () => $("#sidebar").classList.toggle("open"));
      $("#logout")?.addEventListener("click", logout);
      $("#refresh-data")?.addEventListener("click", loadData);
      $("#table-search")?.addEventListener("input", e => { state.search = e.target.value; const cursor = e.target.selectionStart; render(); const input = $("#table-search"); input?.focus(); input?.setSelectionRange(cursor, cursor); });
      $("#new-row")?.addEventListener("click", () => openRowModal());
      document.querySelectorAll(".edit-row").forEach(el => el.addEventListener("click", () => openRowModal(el.dataset.key)));
      document.querySelectorAll(".delete-row").forEach(el => el.addEventListener("click", () => deleteRow(el.dataset.key)));
      $("#file-input")?.addEventListener("change", e => e.target.files[0] && importWorkbook(e.target.files[0]));
      const dropzone = $("#dropzone");
      if (dropzone) {
        ["dragenter", "dragover"].forEach(type => dropzone.addEventListener(type, e => { e.preventDefault(); dropzone.classList.add("drag"); }));
        ["dragleave", "drop"].forEach(type => dropzone.addEventListener(type, e => { e.preventDefault(); dropzone.classList.remove("drag"); }));
        dropzone.addEventListener("drop", e => e.dataTransfer.files[0] && importWorkbook(e.dataTransfer.files[0]));
      }
      document.querySelectorAll(".approve-user").forEach(el => el.addEventListener("click", () => updateProfile(el.dataset.id, { approval_status: "approved" })));
      document.querySelectorAll(".reject-user").forEach(el => el.addEventListener("click", () => updateProfile(el.dataset.id, { approval_status: "rejected" })));
      document.querySelectorAll(".role-select").forEach(el => el.addEventListener("change", () => updateProfile(el.dataset.id, { role: el.value })));
    }

    async function boot() {
      state.booting = configured();
      render();
      if (!configured()) return;
      state.supabase = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
      state.supabase.auth.onAuthStateChange(async (_event, session) => {
        state.session = session;
        // Cửa sổ này chỉ là popup phụ để hoàn tất OAuth Google; khi đã có session thì đóng lại,
        // cửa sổ chính (window.opener) sẽ tự nhận session qua đồng bộ đa-tab của Supabase.
        if (window.opener && session) { setTimeout(() => window.close(), 300); return; }
        await resolveProfile(); state.booting = false; render();
      });
      try {
        const { data } = await state.supabase.auth.getSession();
        state.session = data.session; await resolveProfile();
      } finally { state.booting = false; render(); }
    }

    async function resolveProfile() {
      if (!state.session) { state.profile = null; return; }
      const { data, error } = await state.supabase.from("profiles").select("*").eq("id", state.session.user.id).maybeSingle();
      if (error) { toast(`Không đọc được hồ sơ: ${error.message}`, "error"); state.profile = null; return; }
      if (data) {
        state.profile = data;
      } else {
        // Lần đăng nhập Google đầu tiên: chưa có dòng profiles tương ứng.
        // Tự tạo hồ sơ ở trạng thái chờ duyệt để hiển thị đúng màn hình renderPending() thay vì kẹt ở loading.
        const email = state.session.user.email || "";
        const displayName = state.session.user.user_metadata?.full_name || state.session.user.user_metadata?.name || email;
        const { data: created, error: insertError } = await state.supabase
          .from("profiles")
          .insert({ id: state.session.user.id, email, display_name: displayName, approval_status: "pending" })
          .select()
          .maybeSingle();
        if (insertError) {
          // Có thể một trigger phía Supabase đã tạo hồ sơ ngay trước đó (race condition) — đọc lại 1 lần.
          const retry = await state.supabase.from("profiles").select("*").eq("id", state.session.user.id).maybeSingle();
          if (retry.data) {
            state.profile = retry.data;
          } else {
            // Không tự tạo được hồ sơ (có thể do RLS chặn insert) — vẫn hiển thị màn hình chờ duyệt
            // tạm thời trên giao diện, nhưng cần kiểm tra RLS/trigger để hồ sơ thực sự được lưu và
            // xuất hiện trong danh sách phê duyệt của Super-admin.
            toast(`Không tạo được hồ sơ mới: ${insertError.message}`, "error");
            state.profile = { id: state.session.user.id, email, display_name: displayName, approval_status: "pending" };
          }
        } else {
          state.profile = created;
        }
      }
      if (state.profile?.approval_status === "approved") await loadData();
      subscribeProfileChanges(state.session.user.id);
    }

    function subscribeProfileChanges(userId) {
      if (profileChannel) { state.supabase.removeChannel(profileChannel); profileChannel = null; }
      if (!userId) return;
      profileChannel = state.supabase
        .channel(`${APP_CHANNEL_PREFIX}:profile-${userId}`)
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "profiles", filter: `id=eq.${userId}` }, async (payload) => {
          state.profile = payload.new;
          if (state.profile.approval_status === "approved") { toast("Tài khoản của bạn đã được phê duyệt!", "success"); await loadData(); }
          render();
        })
        .subscribe();
      // Nếu là Super-admin, lắng nghe luôn kênh thông báo "có người vừa gửi yêu cầu chờ duyệt".
      if (isAdmin()) subscribeAdminNotifications(); else if (adminChannel) { state.supabase.removeChannel(adminChannel); adminChannel = null; }
    }

    function subscribeAdminNotifications() {
      if (adminChannel) { state.supabase.removeChannel(adminChannel); adminChannel = null; }
      adminChannel = state.supabase
        .channel(`${APP_CHANNEL_PREFIX}:admin-notify`)
        .on("broadcast", { event: "new-request" }, async (payload) => {
          const p = payload.payload || {};
          toast(`${p.display_name || p.email || "Một tài khoản"} vừa gửi yêu cầu phê duyệt.`);
          await loadData();
          render();
        })
        .subscribe();
    }

    async function sendRequestToAdmin() {
      if (!state.supabase || !state.session || state.requestSent) return;
      const channel = state.supabase.channel(`${APP_CHANNEL_PREFIX}:admin-notify`);
      channel.subscribe(async (status) => {
        if (status === "SUBSCRIBED") {
          await channel.send({
            type: "broadcast",
            event: "new-request",
            payload: { email: state.profile?.email || state.session.user.email, display_name: state.profile?.display_name || "" }
          });
          state.supabase.removeChannel(channel);
        }
      });
      state.requestSent = true;
      toast("Đã gửi yêu cầu tới quản trị viên.", "success");
      render();
    }

    async function loadData() {
      if (!state.supabase || !state.profile) return;
      setLoading(true);
      const [dms, central, profiles, logs] = await Promise.all([
        state.supabase.from("dms_users").select("*", { count: "exact" }).order("updated_at", { ascending: false }).limit(500),
        state.supabase.from("central_users").select("*", { count: "exact" }).order("updated_at", { ascending: false }).limit(500),
        isAdmin() ? state.supabase.from("profiles").select("*").order("created_at", { ascending: false }) : Promise.resolve({ data: [], count: 0 }),
        isAdmin() ? state.supabase.from("import_logs").select("*").order("created_at", { ascending: false }).limit(20) : Promise.resolve({ data: [], count: 0 })
      ]);
      if (dms.error || central.error) toast(`Không tải được dữ liệu: ${(dms.error || central.error).message}`, "error");
      state.dms = dms.data || []; state.central = central.data || []; state.profiles = profiles.data || []; state.logs = logs.data || [];
      state.counts.dms = dms.count ?? state.dms.length; state.counts.central = central.count ?? state.central.length;
      state.counts.pending = state.profiles.filter(p => p.approval_status === "pending").length;
      setLoading(false); if ($("#root").innerHTML) render();
    }

    async function login() {
      if (!configured() || !state.supabase) {
        toast("Hãy tự cấu hình SUPABASE_CONFIG ở đầu file HTML trước khi đăng nhập.", "error");
        return;
      }
      setLoginBusy(true);
      // Google chặn (403) việc load trang đăng nhập của họ bên trong iframe, nên ta mở OAuth
      // trong một cửa sổ popup riêng thay vì để Supabase redirect ngay tại trang hiện tại.
      const { data, error } = await state.supabase.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.href, skipBrowserRedirect: true }
      });
      if (error) { setLoginBusy(false); toast(`Đăng nhập thất bại: ${error.message}`, "error"); return; }
      const w = 480, h = 640;
      const left = window.screenX + (window.outerWidth - w) / 2;
      const top = window.screenY + (window.outerHeight - h) / 2;
      const popup = window.open(data.url, "google-login", `width=${w},height=${h},left=${left},top=${top},menubar=no,toolbar=no,location=no,status=no`);
      if (!popup) {
        setLoginBusy(false);
        toast("Trình duyệt đã chặn cửa sổ popup. Vui lòng cho phép popup cho trang này rồi bấm đăng nhập lại.", "error");
        return;
      }
      // Dự phòng: nếu sự kiện đồng bộ đa-tab của Supabase không kịp bắt, khi popup đóng ta
      // vẫn chủ động đọc lại session từ localStorage để cập nhật giao diện.
      const poll = setInterval(async () => {
        if (popup.closed) {
          clearInterval(poll); setLoginBusy(false);
          const { data: sd } = await state.supabase.auth.getSession();
          if (sd.session) { state.session = sd.session; await resolveProfile(); render(); }
        }
      }, 500);
    }
    async function logout() {
      if (profileChannel) { state.supabase?.removeChannel(profileChannel); profileChannel = null; }
      if (adminChannel) { state.supabase?.removeChannel(adminChannel); adminChannel = null; }
      state.requestSent = false;
      state.tab = "dashboard";
      await state.supabase?.auth.signOut(); state.session = null; state.profile = null; render();
    }

    function normalizeHeader(value) {
      return String(value ?? "").trim().toLowerCase().replace(/[^a-z0-9]/g, "");
    }
    function valueFrom(row, label) {
      const wanted = normalizeHeader(label);
      const key = Object.keys(row).find(k => normalizeHeader(k) === wanted);
      return key ? (row[key] === null || row[key] === undefined ? null : String(row[key])) : null;
    }
    function mapSheetRow(row, fields) {
      const payload = {};
      fields.forEach(([key, label]) => payload[key] = valueFrom(row, label));
      payload.updated_at = new Date().toISOString();
      return payload;
    }
    async function upsertBatches(table, rows) {
      const chunkSize = 400;
      for (let i = 0; i < rows.length; i += chunkSize) {
        const { error } = await state.supabase.from(table).upsert(rows.slice(i, i + chunkSize), { onConflict: "username" });
        if (error) throw error;
      }
    }
    async function importWorkbook(file) {
      if (!isAdmin()) return toast("Chỉ Super-admin mới được import dữ liệu.", "error");
      const status = $("#import-status"); if (status) status.innerHTML = `<div class="loading"><i class="spinner"></i> Đang đọc và upsert ${escapeHtml(file.name)}…</div>`;
      try {
        const workbook = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: false });
        const getSheet = (expected) => workbook.Sheets[workbook.SheetNames.find(name => normalizeHeader(name) === normalizeHeader(expected)) || expected];
        const dmsSheet = getSheet("DMS Userlist"), centralSheet = getSheet("Central User list");
        if (!dmsSheet || !centralSheet) throw new Error("File phải có đúng hai sheet: DMS Userlist và Central User list.");
        const dmsRows = XLSX.utils.sheet_to_json(dmsSheet, { defval: null }).map(row => mapSheetRow(row, DMS_FIELDS)).filter(row => row.username);
        const centralRows = XLSX.utils.sheet_to_json(centralSheet, { defval: null }).map(row => mapSheetRow(row, CENTRAL_FIELDS)).filter(row => row.username);
        await upsertBatches("dms_users", dmsRows); await upsertBatches("central_users", centralRows);
        const { error: logError } = await state.supabase.from("import_logs").insert({ file_name: file.name, dms_rows: dmsRows.length, central_rows: centralRows.length, imported_by: state.session.user.id, status: "success" });
        if (logError) throw logError;
        if (status) status.innerHTML = `<div class="notice notice-info"><b>Import thành công.</b> Đã upsert ${dmsRows.length.toLocaleString("vi-VN")} DMS và ${centralRows.length.toLocaleString("vi-VN")} Central. Dòng trùng UserName đã được cập nhật đè.</div>`;
        toast("Import masterdata thành công.", "success"); await loadData();
      } catch (error) {
        try { await state.supabase.from("import_logs").insert({ file_name: file.name, imported_by: state.session.user.id, status: "error", error_message: error.message }); } catch (_) {}
        if (status) status.innerHTML = `<div class="notice notice-danger"><b>Import thất bại.</b> ${escapeHtml(error.message)}</div>`;
        toast(`Import thất bại: ${error.message}`, "error");
      }
    }

    function openRowModal(key) {
      const isDms = state.tab === "dms", fields = isDms ? DMS_FIELDS : CENTRAL_FIELDS, table = isDms ? "dms_users" : "central_users";
      const rows = isDms ? state.dms : state.central, row = key ? rows.find(item => item.username === key) : {};
      const modalRoot = $("#modal-root");
      modalRoot.innerHTML = `<div class="modal-backdrop" id="modal-backdrop"><section class="modal"><div class="modal-head"><div><h2>${key ? "Chỉnh sửa bản ghi" : "Thêm bản ghi mới"}</h2><p>${isDms ? "DMS Userlist" : "Central User list"} • khóa chính UserName</p></div><button class="btn btn-plain" id="close-modal">${ICONS.close}</button></div><div class="modal-body"><form id="record-form" class="form-grid">${fields.map(([field, label, required]) => `<div class="field ${["description", "territory_hierarchy"].includes(field) ? "full" : ""}"><label for="field-${field}">${escapeHtml(label)}${required ? " *" : ""}</label>${field === "description" || field === "territory_hierarchy" ? `<textarea id="field-${field}" ${key && field === "username" ? "disabled" : ""}>${escapeHtml(row[field])}</textarea>` : `<input id="field-${field}" value="${escapeHtml(row[field])}" ${required ? "required" : ""} ${key && field === "username" ? "readonly" : ""} />`}</div>`).join("")}</form></div><div class="modal-foot"><button class="btn btn-secondary" id="cancel-modal">Hủy</button><button class="btn btn-primary" id="save-record">Lưu bản ghi</button></div></section></div>`;
      const close = () => modalRoot.innerHTML = "";
      $("#close-modal").addEventListener("click", close); $("#cancel-modal").addEventListener("click", close); $("#modal-backdrop").addEventListener("click", e => e.target.id === "modal-backdrop" && close());
      $("#save-record").addEventListener("click", async () => {
        const form = $("#record-form"); if (!form.reportValidity()) return;
        const payload = {}; fields.forEach(([field]) => payload[field] = $(`#field-${field}`).value || null); payload.updated_at = new Date().toISOString();
        const { error } = await state.supabase.from(table).upsert(payload, { onConflict: "username" });
        if (error) return toast(`Không lưu được: ${error.message}`, "error");
        close(); toast("Đã lưu bản ghi.", "success"); await loadData();
      });
    }

    async function deleteRow(key) {
      if (!isAdmin() || !confirm(`Xóa bản ghi UserName "${key}"? Hành động này không thể hoàn tác.`)) return;
      const table = state.tab === "dms" ? "dms_users" : "central_users";
      const { error } = await state.supabase.from(table).delete().eq("username", key);
      if (error) return toast(`Không xóa được: ${error.message}`, "error");
      toast("Đã xóa bản ghi.", "success"); await loadData();
    }

    async function updateProfile(id, changes) {
      const { error } = await state.supabase.from("profiles").update({ ...changes, updated_at: new Date().toISOString() }).eq("id", id);
      if (error) return toast(`Không cập nhật được quyền: ${error.message}`, "error");
      toast("Đã cập nhật tài khoản.", "success"); await loadData();
    }

    document.addEventListener("click", e => {
      if (e.target.closest("#google-login")) login().catch(err => { setLoginBusy(false); toast(`Đăng nhập thất bại: ${err.message}`, "error"); });
      if (e.target.closest("#logout-pending")) logout();
      if (e.target.closest("#send-request-btn")) sendRequestToAdmin();
    });
    boot();
  </script>
</body>
</html>
