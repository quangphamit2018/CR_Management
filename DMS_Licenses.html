<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masterdata DMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <meta name="description" content="Cổng quản lý Masterdata với xác thực Google và phân quyền Supabase." />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <style>
    /* =====================================================================
       Masterdata DMS — Crimson theme
       Màu gốc #b71c1c. Gradient đi từ đỏ tươi (#e53935) → đỏ gốc → đỏ rượu vang (#3d080c),
       điểm nhấn vàng hổ phách (#ffc857) dùng rất tiết chế cho trạng thái active / eyebrow.
       ===================================================================== */
    :root {
      --ink: #2a1416;
      --ink-2: #4a2f31;
      --muted: #80666a;
      --line: #f1dedd;
      --line-strong: #e7c7c5;
      --surface: #ffffff;
      --surface-soft: #fdf6f5;

      --brand: #b71c1c;
      --brand-light: #e53935;
      --brand-dark: #8e1216;
      --brand-deep: #5a0d12;
      --brand-soft: #fdeceb;
      --brand-soft-2: #fbd5d2;
      --gold: #ffc857;

      --g-brand: linear-gradient(135deg, #dc3b36 0%, #b71c1c 52%, #8a1015 100%);
      --g-brand-hover: linear-gradient(135deg, #ea4a44 0%, #c62626 52%, #9b1419 100%);
      --g-deep: linear-gradient(165deg, #6b1117 0%, #3d080c 58%, #1e0407 100%);
      --g-soft: linear-gradient(135deg, #fff3f2 0%, #fde2df 100%);
      --g-text: linear-gradient(100deg, #3d080c 0%, #b71c1c 100%);

      --success: #0b7a4f;
      --success-soft: #e4f6ed;
      --warning: #b45309;
      --warning-soft: #fff3df;
      --danger: #a31515;
      --danger-soft: #ffeceb;

      --shadow: 0 22px 60px rgba(90, 13, 18, .14);
      --shadow-card: 0 1px 2px rgba(90, 13, 18, .05), 0 10px 28px rgba(120, 20, 24, .06);
      --radius: 18px;
      --sidebar: 262px;
      font-family: "Be Vietnam Pro", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #f4e2e0;
    }
    * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #dba7a4 transparent; }
    *::-webkit-scrollbar { width: 9px; height: 9px; }
    *::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #e8a9a5, #c96a66); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
    ::selection { background: #b71c1c; color: #fff; }
    body {
      margin: 0; min-width: 320px; color: var(--ink);
      background:
        radial-gradient(900px 480px at 92% -8%, rgba(229, 57, 53, .11), transparent 62%),
        radial-gradient(800px 520px at -8% 108%, rgba(183, 28, 28, .10), transparent 60%),
        #f4e2e0;
      background-attachment: fixed;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--brand-light); outline-offset: 2px; }
    .hidden { display: none !important; }
    .app-shell { min-height: 100vh; display: flex; }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: var(--sidebar); flex: 0 0 var(--sidebar); color: #f0d4d2; overflow: hidden;
      background: var(--g-deep);
      display: flex; flex-direction: column; padding: 24px 16px; position: fixed; inset: 0 auto 0 0; z-index: 20;
    }
    .sidebar::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(260px 220px at 0% 0%, rgba(239, 83, 80, .45), transparent 70%),
        radial-gradient(240px 260px at 100% 100%, rgba(183, 28, 28, .40), transparent 70%);
    }
    .sidebar > * { position: relative; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 12px; padding: 2px 10px 30px; color: #fff; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff; flex: 0 0 auto;
      background: linear-gradient(135deg, #ff7a6b 0%, #e53935 45%, #a51218 100%);
      box-shadow: 0 6px 18px rgba(229, 57, 53, .45), inset 0 1px 0 rgba(255, 255, 255, .38);
    }
    .brand-mark svg { width: 19px; height: 19px; }
    .brand strong { font-size: 15px; letter-spacing: -.02em; }
    .brand small { display: block; color: #d8a7a5; font-size: 10.5px; margin-top: 3px; }
    .nav-label { font-size: 11px; font-weight: 600; letter-spacing: .02em; color: rgba(255, 220, 217, .5); padding: 0 12px 9px; }
    .nav { display: grid; gap: 5px; }
    .nav button {
      border: 0; background: transparent; color: #dfb9b7; text-align: left; padding: 11px 12px; font-weight: 500;
      border-radius: 12px; display: flex; align-items: center; gap: 11px; transition: .18s ease;
    }
    .nav button:hover { background: rgba(255, 255, 255, .09); color: #fff; }
    .nav button.active {
      color: #fff; font-weight: 650;
      background: linear-gradient(100deg, #e53935 0%, #b71c1c 70%, #94141a 100%);
      box-shadow: inset 3px 0 0 var(--gold), 0 8px 20px rgba(0, 0, 0, .28);
    }
    .nav button:focus-visible, .signout:focus-visible { outline-color: var(--gold); }
    .nav svg { width: 17px; height: 17px; flex: 0 0 auto; }
    .sidebar-foot { margin-top: auto; padding: 16px 4px 0; border-top: 1px solid rgba(255, 255, 255, .12); }
    .user-card {
      display: flex; align-items: center; gap: 9px; padding: 8px 8px 8px 9px; border-radius: 14px;
      background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .08); transition: .18s ease;
    }
    .user-card:hover { background: rgba(255, 255, 255, .09); border-color: rgba(255, 255, 255, .14); }
    .user-chip { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
    .user-chip div:last-child { min-width: 0; }
    .user-chip b, .user-chip span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-chip b { color: #fff4f3; font-size: 12px; }
    .user-chip span { color: #d8a7a5; font-size: 11px; margin-top: 2px; }
    .signout {
      flex: 0 0 auto; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; padding: 0;
      border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .05); color: #dfb9b7; transition: .18s ease;
    }
    .signout svg { width: 15px; height: 15px; }
    .signout:hover { background: linear-gradient(135deg, #ea4a44, #8e1216); color: #fff; border-color: transparent; box-shadow: 0 8px 18px rgba(183, 28, 28, .38); transform: translateY(-1px); }
    .signout:active { transform: translateY(0); }
    .avatar {
      width: 33px; height: 33px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: 0 0 auto;
      background: linear-gradient(135deg, #ffe0a8, #ff9a76); color: #5a0d12; box-shadow: 0 0 0 2px rgba(255, 255, 255, .18);
    }

    /* ---------- Main / topbar ---------- */
    .main { margin-left: var(--sidebar); flex: 1; min-width: 0; }
    .topbar {
      height: 78px; padding: 0 36px; background: linear-gradient(180deg, #fffefe 0%, #fffbfa 100%); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 16px; position: sticky; top: 0; z-index: 10;
      box-shadow: 0 10px 26px rgba(90, 13, 18, .07), 0 1px 0 rgba(255, 255, 255, .6) inset;
    }
    .topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 3px; background: linear-gradient(90deg, #b71c1c 0%, #e53935 32%, rgba(229, 57, 53, 0) 80%); }
    .topbar-icon {
      width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; color: #fff; flex: 0 0 auto;
      background: var(--g-brand); box-shadow: 0 10px 20px rgba(183, 28, 28, .32), inset 0 1px 0 rgba(255, 255, 255, .3);
    }
    .topbar-icon svg { width: 19px; height: 19px; }
    .topbar h1 { margin: 0; font-size: 21px; font-weight: 780; letter-spacing: -.03em; color: var(--ink); }
    .topbar p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }

    /* ---------- Topbar right: connection badge ---------- */
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    .conn-badge {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 99px; font-size: 12px; font-weight: 700;
      background: linear-gradient(135deg, #e9f9f1, #d2f1e2); border: 1px solid #b6e5cf; color: var(--success); white-space: nowrap;
      box-shadow: 0 6px 16px rgba(11, 122, 79, .14), inset 0 1px 0 rgba(255, 255, 255, .5);
    }
    .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex: 0 0 auto; animation: conn-pulse 1.8s infinite; }
    @keyframes conn-pulse { 0% { box-shadow: 0 0 0 0 rgba(11, 122, 79, .45); } 70% { box-shadow: 0 0 0 6px rgba(11, 122, 79, 0); } 100% { box-shadow: 0 0 0 0 rgba(11, 122, 79, 0); } }
    /* section.page: "tờ làm việc" sáng, bo góc, có viền và bóng — nổi hẳn lên khỏi nền hồng đậm phía sau */
    .page {
      position: relative; margin: 18px 24px 26px; padding: 20px 24px 26px; border-radius: 30px;
      background:
        radial-gradient(640px 260px at 100% 0%, rgba(229, 57, 53, .07), transparent 70%),
        linear-gradient(180deg, #fffefd 0%, #fff7f6 100%);
      border: 1px solid #efcdcb;
      box-shadow: inset 0 1px 0 #fff, 0 2px 6px rgba(120, 20, 24, .06), 0 36px 80px rgba(120, 20, 24, .13);
    }
    .page .panel { border-color: #f0d6d4; box-shadow: 0 1px 2px rgba(90, 13, 18, .06), 0 16px 38px rgba(120, 20, 24, .10); }
    .eyebrow {
      display: inline-block; color: var(--brand); font-size: 12px; font-weight: 650; margin-bottom: 10px;
      background: var(--g-soft); border: 1px solid var(--brand-soft-2); border-radius: 99px; padding: 4px 11px;
    }
    .page-title {
      margin: 0; font-size: 29px; letter-spacing: -.04em; line-height: 1.2; font-weight: 750; width: fit-content; max-width: 100%;
      background: var(--g-text); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    }
    .page-subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    /* header-row: banner đỏ đậm ở đầu mỗi trang, cùng họ với sidebar */
    .header-row {
      position: relative; overflow: hidden; display: flex; justify-content: space-between; gap: 18px; align-items: center;
      padding: 20px 28px; margin-bottom: 18px; border-radius: 22px;
      background:
        radial-gradient(360px 220px at 92% -30%, rgba(255, 200, 87, .30), transparent 65%),
        radial-gradient(320px 220px at 6% 140%, rgba(255, 110, 96, .34), transparent 65%),
        linear-gradient(118deg, #c62828 0%, #a11318 46%, #5e0c12 100%);
      box-shadow: 0 18px 38px rgba(140, 18, 24, .28), inset 0 1px 0 rgba(255, 255, 255, .18);
    }
    .header-row::after {
      content: ""; position: absolute; right: -50px; bottom: -120px; width: 260px; height: 260px; border-radius: 50%; pointer-events: none;
      border: 1px solid rgba(255, 255, 255, .15); box-shadow: 0 0 0 30px rgba(255, 255, 255, .03), 0 0 0 62px rgba(255, 255, 255, .02);
    }
    .header-row > * { position: relative; z-index: 1; }
    .header-row .eyebrow { background: rgba(255, 255, 255, .13); border-color: rgba(255, 255, 255, .22); color: #ffdca0; margin-bottom: 9px; }
    .header-row .page-title { background: none; -webkit-text-fill-color: #fff; color: #fff; font-size: 27px; }
    .header-row .page-subtitle { color: rgba(255, 236, 234, .84); margin-top: 6px; }

    /* Dải chào mừng ở Tổng quan — điểm nhấn gradient lớn nhất của app */
    .header-row.hero {
      position: relative; overflow: hidden; align-items: center; padding: 30px 32px; border-radius: 24px; margin-bottom: 24px;
      background:
        radial-gradient(420px 260px at 88% -20%, rgba(255, 200, 87, .38), transparent 65%),
        radial-gradient(360px 260px at 8% 130%, rgba(255, 110, 96, .40), transparent 65%),
        linear-gradient(118deg, #c62828 0%, #a11318 42%, #5e0c12 100%);
      box-shadow: 0 22px 46px rgba(140, 18, 24, .30), inset 0 1px 0 rgba(255, 255, 255, .18);
    }
    .header-row.hero::after {
      content: ""; position: absolute; right: -60px; bottom: -110px; width: 320px; height: 320px; border-radius: 50%; pointer-events: none;
      border: 1px solid rgba(255, 255, 255, .16); box-shadow: 0 0 0 38px rgba(255, 255, 255, .035), 0 0 0 78px rgba(255, 255, 255, .025);
    }
    .header-row.hero > * { position: relative; z-index: 1; }
    .hero .eyebrow { background: rgba(255, 255, 255, .13); border-color: rgba(255, 255, 255, .22); color: #ffdca0; }
    .hero .page-title { background: none; -webkit-text-fill-color: #fff; color: #fff; font-size: 30px; }
    .hero .page-subtitle { color: rgba(255, 236, 234, .82); }

    .actions { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; gap: 8px; align-items: center; justify-content: center; border: 1px solid transparent;
      border-radius: 11px; padding: 10px 16px; font-size: 13px; font-weight: 650; transition: .2s ease; white-space: nowrap;
    }
    .btn svg { width: 16px; height: 16px; }
    .btn-primary {
      color: #fff; background: var(--g-brand); background-size: 140% 140%; background-position: 0 50%;
      box-shadow: 0 8px 20px rgba(183, 28, 28, .30), inset 0 1px 0 rgba(255, 255, 255, .22);
    }
    .btn-primary:hover { background: var(--g-brand-hover); transform: translateY(-1px); box-shadow: 0 12px 26px rgba(183, 28, 28, .38), inset 0 1px 0 rgba(255, 255, 255, .28); }
    .btn-primary:active { transform: translateY(0); box-shadow: 0 4px 10px rgba(183, 28, 28, .3); }
    .btn-light { color: #8e1216; background: linear-gradient(180deg, #fff, #ffeceb); box-shadow: 0 8px 22px rgba(0, 0, 0, .22); }
    .btn-light:hover { background: #fff; transform: translateY(-1px); }
    .btn-secondary { background: linear-gradient(180deg, #fff, #fff8f7); color: var(--ink-2); border-color: var(--line-strong); }
    .btn-secondary:hover { background: var(--g-soft); border-color: #dc8985; color: var(--brand-dark); }
    .btn-danger { background: linear-gradient(180deg, #fff5f4, #ffe4e2); color: var(--danger); border-color: #f0b3b0; }
    .btn-danger:hover { background: linear-gradient(135deg, #a31515, #6b0d10); color: #fff; border-color: transparent; }
    .btn-plain { background: transparent; color: var(--muted); border: 0; padding: 6px; border-radius: 9px; }
    .btn-plain:hover { background: var(--brand-soft); color: var(--brand); }
    .btn:disabled { cursor: not-allowed; opacity: .55; transform: none; }
    .btn-icon { display: inline-flex; width: 16px; height: 16px; flex: 0 0 auto; }
    .btn-icon svg { width: 16px; height: 16px; }
    .btn-icon.spin svg { animation: spin .85s linear infinite; }
    .btn-excel {
      color: #0b6b42; background: linear-gradient(180deg, #fff, #eafaf1); border-color: #b6e5cf;
      box-shadow: 0 1px 0 rgba(255, 255, 255, .6) inset;
    }
    .btn-excel:hover {
      background: linear-gradient(135deg, #17a765, #0b6b42); color: #fff; border-color: transparent;
      transform: translateY(-1px); box-shadow: 0 10px 22px rgba(11, 107, 66, .30);
    }
    .btn-excel:active { transform: translateY(0); }

    /* ---------- Cards ---------- */
    .grid-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 22px; }
    .stat-card, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-card); }
    .stat-card { --a: #e53935; --b: #a51218; padding: 20px 18px 18px; position: relative; overflow: hidden; }
    .stat-card:nth-child(2) { --a: #f4511e; --b: #b23a0c; }
    .stat-card:nth-child(3) { --a: #d81b60; --b: #7c0b45; }
    .stat-card:nth-child(4) { --a: #d97706; --b: #a8410a; }
    .stat-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--a), var(--b)); }
    .stat-card::after { content: ""; position: absolute; width: 96px; height: 96px; border-radius: 50%; right: -28px; top: -34px; background: linear-gradient(135deg, var(--a), var(--b)); opacity: .13; }
    .stat-label { color: var(--muted); font-size: 12px; font-weight: 600; position: relative; z-index: 1; }
    .stat-value {
      font-size: 30px; font-weight: 750; letter-spacing: -.04em; margin-top: 10px; position: relative; z-index: 1; font-variant-numeric: tabular-nums;
      width: fit-content; max-width: 100%;
      background: linear-gradient(120deg, var(--a), var(--b)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    }
    .stat-note { color: #a08b8d; font-size: 11px; margin-top: 4px; position: relative; z-index: 1; }
    .panel { overflow: hidden; }
    .panel-head {
      padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px;
      background: linear-gradient(180deg, #fffdfd, #fff7f6);
    }
    .panel-head h2 { margin: 0; font-size: 15px; letter-spacing: -.015em; display: flex; align-items: center; gap: 9px; }
    .panel-head h2::before { content: ""; width: 4px; height: 16px; border-radius: 4px; background: linear-gradient(180deg, #e53935, #8e1216); flex: 0 0 auto; }
    .panel-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .panel-body { padding: 20px; }

    /* ---------- Tables ---------- */
    .table-wrap { width: 100%; overflow: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 820px; }
    th, td { padding: 11px 16px; border-bottom: 1px solid #f7e9e8; text-align: left; font-size: 12px; vertical-align: middle; white-space: nowrap; font-variant-numeric: tabular-nums; }
    th {
      color: #7f2a2c; font-size: 11.5px; font-weight: 700; letter-spacing: .01em; position: sticky; top: 0; z-index: 1;
      background: linear-gradient(180deg, #fff6f5, #fdeae8); border-bottom: 1px solid var(--line-strong);
    }
    td { color: var(--ink-2); }
    tr:hover td { background: linear-gradient(90deg, #fff1f0, #fffafa); }
    td strong { color: var(--ink); font-size: 12px; }
    tbody tr:last-child td { border-bottom: 0; }

    /* Bảng dữ liệu lớn: cố định chiều cao, cuộn ngang + dọc, tiêu đề và cột chính luôn hiển thị */
    .data-scroll { height: clamp(320px, calc(100vh - 444px), 800px); overflow: auto; overscroll-behavior: contain; background: #fff; }
    .data-scroll.is-empty { display: grid; place-items: center; overflow: hidden; }
    .data-table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: max-content; }
    .data-table tbody tr { --row-bg: #fff; }
    .data-table tbody tr:nth-child(even) { --row-bg: #fffafa; }
    .data-table tbody tr:hover { --row-bg: #fff0ef; }
    .data-table tbody td { background: var(--row-bg); }
    .data-table tbody tr:hover td { background: var(--row-bg); }
    .data-table tbody tr:last-child td { border-bottom: 1px solid #f7e9e8; }
    .data-table thead th { position: sticky; top: 0; z-index: 2; }
    .data-table .col-idx, .data-table tr > :nth-child(2), .data-table .col-act { position: sticky; }
    .data-table .col-idx { left: 0; width: 76px; min-width: 76px; max-width: 76px; padding-inline: 12px; text-align: right; color: #a08b8d; }
    .data-table tr > :nth-child(2) { left: 76px; box-shadow: 1px 0 0 var(--line-strong); }
    .data-table .col-act { right: 0; box-shadow: -1px 0 0 var(--line-strong); }
    .data-table tbody .col-idx, .data-table tbody tr > :nth-child(2), .data-table tbody .col-act { z-index: 1; }
    .data-table thead .col-idx, .data-table thead tr > :nth-child(2), .data-table thead .col-act { z-index: 3; }
    .data-table .nil { color: #d2bcbd; }
    .data-table th, .data-table td { padding-block: 9px; }
    .data-table .btn-plain { padding: 4px; }
    .data-table .btn-plain svg { width: 15px; height: 15px; }

    .pager {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 22px;
      padding: 12px 20px; border-top: 1px solid var(--line-strong); background: linear-gradient(180deg, #fffafa, #fff4f3);
      font-size: 12px; color: var(--muted);
    }
    .pager b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
    .pager-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
    .pager-size, .pager-jump { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
    .pager-size select, .pager-jump input {
      height: 32px; border: 1px solid var(--line-strong); border-radius: 9px; padding: 0 8px; background: #fff; color: var(--ink);
      font-size: 12px; font-weight: 600; outline: none; transition: .18s;
    }
    .pager-jump input { width: 64px; text-align: center; }
    .pager-size select:focus, .pager-jump input:focus { border-color: #dd5a55; box-shadow: 0 0 0 4px rgba(229, 57, 53, .13); }
    .pager-nav { display: flex; align-items: center; gap: 4px; }
    .pager-btn {
      min-width: 32px; height: 32px; padding: 0 9px; border-radius: 9px; border: 1px solid var(--line-strong); background: linear-gradient(180deg, #fff, #fff8f7);
      color: var(--ink-2); font-size: 12px; font-weight: 650; display: inline-grid; place-items: center; transition: .16s; font-variant-numeric: tabular-nums;
    }
    .pager-btn svg { width: 15px; height: 15px; }
    .pager-btn:hover:not(:disabled):not(.active) { background: var(--g-soft); border-color: #dc8985; color: var(--brand-dark); }
    .pager-btn.active { background: var(--g-brand); color: #fff; border-color: transparent; box-shadow: 0 6px 14px rgba(183, 28, 28, .30); cursor: default; }
    .pager-btn:disabled { opacity: .42; cursor: not-allowed; }
    .pager-gap { min-width: 22px; text-align: center; color: #c98c89; }
    .toolbar-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* ---------- Badges / notices ---------- */
    .badge { display: inline-flex; align-items: center; border-radius: 99px; padding: 4px 10px; font-size: 10.5px; font-weight: 700; border: 1px solid transparent; }
    .badge-success { background: linear-gradient(135deg, #e9f9f1, #d2f1e2); color: var(--success); border-color: #b6e5cf; }
    .badge-warning { background: linear-gradient(135deg, #fff6e6, #ffe8c2); color: var(--warning); border-color: #f6d7a0; }
    .badge-danger { background: linear-gradient(135deg, #ffeeed, #ffd6d3); color: var(--danger); border-color: #f5b7b3; }
    .badge-blue { background: linear-gradient(135deg, #fff0ef, #fbd3cf); color: var(--brand); border-color: #f2b7b2; }
    .notice { border-radius: 12px; padding: 12px 14px; font-size: 12px; line-height: 1.55; border-left: 3px solid transparent; }
    .notice-info { background: linear-gradient(100deg, #fff1f0, #fff8f7); color: #7a1418; border-left-color: var(--brand); }
    .notice-warning { background: linear-gradient(100deg, #fff3df, #fffaf1); color: #8a3d05; border-left-color: #f59e0b; }
    .notice-danger { background: linear-gradient(100deg, #ffe4e2, #fff3f2); color: #7d1212; border-left-color: #8e1216; }

    /* ---------- Import: progress bar + kết quả ---------- */
    .progress-card { background: linear-gradient(180deg, #fff, #fffafa); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(90, 13, 18, .04); animation: fade-in .18s ease both; }
    .progress-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .progress-label { font-size: 12.5px; font-weight: 650; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .progress-pct { font-size: 13px; font-weight: 780; color: var(--brand); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
    .progress-track { position: relative; height: 10px; border-radius: 99px; background: #f6e2e1; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; background: var(--g-brand); transition: width .35s ease; position: relative; overflow: hidden; min-width: 10px; }
    .progress-fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .5), transparent); animation: progress-shimmer 1.3s linear infinite; }
    @keyframes progress-shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    .progress-sub { margin-top: 9px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .result-card { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 15px 16px; border: 1px solid; animation: confirm-pop .2s ease both; }
    .result-card.success { background: linear-gradient(135deg, #eafaf1, #dcf4e7); border-color: #b6e5cf; }
    .result-card.error { background: linear-gradient(135deg, #fff1f0, #ffe0dd); border-color: #f5b7b3; }
    .result-icon { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #fff; }
    .result-card.success .result-icon { color: var(--success); box-shadow: 0 4px 12px rgba(11, 122, 79, .20); }
    .result-card.error .result-icon { color: var(--danger); box-shadow: 0 4px 12px rgba(163, 21, 21, .20); }
    .result-icon svg { width: 17px; height: 17px; }
    .result-title { font-size: 13px; font-weight: 760; color: var(--ink); margin-bottom: 3px; }
    .result-detail { font-size: 12px; color: var(--ink-2); line-height: 1.65; }

    /* ---------- Toolbar / inputs ---------- */
    .toolbar { padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #fff, #fffafa); }
    .search { width: min(340px, 100%); position: relative; }
    .search input {
      width: 100%; height: 38px; padding: 0 34px 0 36px; border: 1.5px solid var(--line-strong); border-radius: 11px; outline: none;
      color: var(--ink); background: #fff; font-size: 12.5px; font-weight: 500; transition: .2s ease;
      box-shadow: inset 0 1px 2px rgba(90, 13, 18, .03);
    }
    .search input::placeholder { color: #b98f8d; font-weight: 400; }
    .search:hover input { border-color: #dba7a4; }
    .search input:focus, .field input:focus, .field select:focus, .field textarea:focus, .role-select:focus {
      border-color: #dd5a55; box-shadow: 0 0 0 4px rgba(229, 57, 53, .13);
    }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #c98c89; width: 16px; height: 16px; pointer-events: none; transition: color .2s; }
    .search input:focus ~ .search-icon { color: var(--brand); }
    .search svg { display: block; }
    .search-clear {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%;
      display: none; align-items: center; justify-content: center; border: 0; background: #f6e2e1; color: #a5696a; padding: 0; transition: .15s;
    }
    .search-clear svg { width: 12px; height: 12px; }
    .search-clear:hover { background: var(--brand); color: #fff; }
    .search.has-value .search-clear { display: inline-flex; }
    .search.has-value input { padding-right: 34px; }
    .role-select { border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 8px; font-size: 11px; background: #fff; color: var(--ink-2); outline: none; }
    .role-select:disabled { background: #faf3f2; color: #a08b8d; cursor: not-allowed; }
    .empty { text-align: center; padding: 44px 20px; color: var(--muted); background: radial-gradient(260px 140px at 50% 0%, rgba(229, 57, 53, .06), transparent 70%); }
    .empty strong { display: block; color: var(--ink); font-size: 14px; margin-bottom: 6px; }
    .two-col { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; }
    .two-col .table-wrap table { min-width: 0; }

    /* ---------- Import ---------- */
    .import-drop {
      border: 1.5px dashed #dc9591; border-radius: 16px; padding: 30px; text-align: center; transition: .2s;
      background: linear-gradient(160deg, #fffdfd 0%, #fff1f0 100%);
    }
    .import-drop.drag { border-color: var(--brand); background: linear-gradient(160deg, #ffe6e4 0%, #ffc9c5 100%); box-shadow: 0 0 0 5px rgba(229, 57, 53, .10); }
    .import-drop > svg {
      width: 62px; height: 62px; padding: 16px; border-radius: 20px; color: #fff;
      background: var(--g-brand); box-shadow: 0 12px 26px rgba(183, 28, 28, .32), inset 0 1px 0 rgba(255, 255, 255, .28);
    }
    .import-drop h3 { margin: 14px 0 6px; font-size: 15px; }
    .import-drop p { margin: 0 auto 16px; color: var(--muted); font-size: 12px; max-width: 430px; line-height: 1.6; }
    .setup-code { background: var(--g-deep); color: #f0d4d2; border-radius: 12px; padding: 14px; font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 230px; overflow: auto; white-space: pre-wrap; }
    .table-list { display: grid; gap: 10px; }
    .table-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(180deg, #fff, #fffafa); transition: .18s; }
    .table-item b { font-size: 12px; display: block; }
    .table-item span { color: var(--muted); font-size: 11px; display: block; margin-top: 3px; }
    button.table-item { width: 100%; color: inherit; text-align: left; }
    button.table-item:hover { border-color: #e29a96; background: linear-gradient(90deg, #fff1f0, #fff); box-shadow: 0 8px 22px rgba(183, 28, 28, .10); }
    .table-item .go {
      margin: 0; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto;
      background: var(--g-brand); color: #fff; font-size: 14px; box-shadow: 0 5px 12px rgba(183, 28, 28, .28);
    }

    /* ---------- Modal ---------- */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(38, 7, 10, .62); backdrop-filter: blur(5px); display: grid; place-items: center; padding: 20px; z-index: 50; }
    .modal-backdrop.confirm-backdrop { z-index: 60; animation: fade-in .15s ease both; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    /* ---------- Confirm dialog (thay browser confirm() mặc định) ---------- */
    .confirm-modal { width: min(400px, 100%); padding: 30px 28px 26px; text-align: center; animation: confirm-pop .22s var(--ease, cubic-bezier(.22, 1, .36, 1)) both; }
    @keyframes confirm-pop { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
    .confirm-icon { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 16px; }
    .confirm-icon svg { width: 24px; height: 24px; }
    .confirm-icon.danger { background: linear-gradient(135deg, #ffe4e2, #ffc9c5); color: var(--danger); box-shadow: 0 10px 24px rgba(163, 21, 21, .20); }
    .confirm-icon.info { background: var(--g-soft); color: var(--brand); box-shadow: 0 10px 24px rgba(183, 28, 28, .16); }
    .confirm-title { margin: 0 0 9px; font-size: 16.5px; font-weight: 760; color: var(--ink); letter-spacing: -.01em; }
    .confirm-msg { margin: 0 0 24px; font-size: 12.5px; color: var(--muted); line-height: 1.65; }
    .confirm-actions { display: flex; gap: 10px; }
    .confirm-actions .btn { flex: 1; padding: 11px 14px; }
    .btn-outline-danger { background: #fff; border-color: var(--line-strong); color: var(--danger); }
    .btn-outline-danger:hover { background: linear-gradient(135deg, #a31515, #6b0d10); color: #fff; border-color: transparent; box-shadow: 0 8px 18px rgba(163, 21, 21, .28); }
    .modal { background: #fff; border-radius: 22px; width: min(630px, 100%); max-height: min(800px, 92vh); overflow: auto; box-shadow: 0 30px 90px rgba(60, 8, 12, .40); }
    .modal-head { padding: 22px 22px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: relative; background: linear-gradient(180deg, #fff4f3, #fff); }
    .modal-head::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: linear-gradient(90deg, #e53935, #b71c1c 55%, #5e0c12); }
    .modal-head h2 { margin: 0; font-size: 17px; }
    .modal-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .modal-body { padding: 21px 22px; }
    .modal-foot { padding: 14px 22px 20px; display: flex; justify-content: flex-end; gap: 9px; background: linear-gradient(180deg, #fff, #fff8f7); border-top: 1px solid var(--line); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 11.5px; color: var(--ink-2); font-weight: 650; }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 11px; outline: none; color: var(--ink); font-size: 12px; background: #fff; transition: .18s; }
    .field textarea { min-height: 82px; resize: vertical; }

    /* ---------- Toast ---------- */
    .toast-wrap { position: fixed; right: 22px; bottom: 22px; z-index: 100; display: grid; gap: 10px; width: min(380px, calc(100vw - 44px)); }
    .toast {
      position: relative; overflow: hidden; display: flex; align-items: flex-start; gap: 10px;
      background: linear-gradient(135deg, #3f2124, #1f0f11); color: #fff; border-radius: 14px; padding: 13px 14px 15px 13px; font-size: 12.5px;
      line-height: 1.45; box-shadow: 0 12px 30px rgba(20, 4, 6, .32), 0 2px 6px rgba(20, 4, 6, .18);
      border: 1px solid rgba(255, 255, 255, .08); animation: toast-in .28s var(--ease, cubic-bezier(.22, 1, .36, 1)) both;
    }
    .toast.leaving { animation: toast-out .2s ease both; }
    .toast.error { background: linear-gradient(135deg, #b3181d, #6b0d10); }
    .toast.success { background: linear-gradient(135deg, #10935f, #075d3b); }
    .toast-icon {
      flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(255, 255, 255, .16); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12);
    }
    .toast-icon svg { width: 14px; height: 14px; }
    .toast.success .toast-icon { color: #a7f3d0; }
    .toast.error .toast-icon { color: #ffb4ac; }
    .toast:not(.success):not(.error) .toast-icon { color: var(--gold); }
    .toast-msg { flex: 1; padding-top: 4px; word-break: break-word; }
    .toast-close {
      flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; border: 0; background: transparent; color: rgba(255, 255, 255, .6);
      display: grid; place-items: center; padding: 0; transition: .15s;
    }
    .toast-close svg { width: 11px; height: 11px; }
    .toast-close:hover { background: rgba(255, 255, 255, .18); color: #fff; }
    .toast-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .55); width: 100%; transform-origin: left; animation: toast-shrink 4.2s linear forwards; }
    .toast.success .toast-bar { background: #a7f3d0; }
    .toast.error .toast-bar { background: #ffb4ac; }
    .toast:not(.success):not(.error) .toast-bar { background: var(--gold); }
    @keyframes toast-in { from { opacity: 0; transform: translateX(26px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes toast-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(20px) scale(.97); } }
    @keyframes toast-shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    .loading { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; }
    .spinner { width: 16px; height: 16px; border: 2px solid #f0cfcc; border-top-color: var(--brand); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mobile-menu { display: none; border: 1px solid var(--line-strong); background: var(--g-soft); color: var(--brand); padding: 7px; border-radius: 11px; }
    .mobile-menu svg { width: 20px; height: 20px; }
    .pill-tabs { display: flex; gap: 5px; background: #fbeceb; padding: 4px; border-radius: 11px; }
    .pill-tabs button { border: 0; background: transparent; color: var(--muted); padding: 7px 10px; border-radius: 8px; font-size: 11px; }
    .pill-tabs button.active { background: #fff; color: var(--brand); box-shadow: 0 2px 8px rgba(183, 28, 28, .14); font-weight: 700; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1050px) { .grid-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .two-col { grid-template-columns: 1fr; } }
    @media (max-width: 760px) {
      :root { --sidebar: 0px; }
      .sidebar { transform: translateX(-100%); transition: transform .2s; width: 262px; }
      .sidebar.open { transform: translateX(0); box-shadow: 14px 0 44px rgba(30, 4, 7, .35); }
      .mobile-menu { display: inline-grid; place-items: center; }
      .topbar { padding: 0 14px; height: 64px; }
      .topbar-icon { width: 32px; height: 32px; border-radius: 10px; }
      .topbar-icon svg { width: 15px; height: 15px; }
      .topbar h1 { font-size: 17px; }
      .topbar p { display: none; }
      .topbar-right { gap: 10px; }
      .conn-badge span:not(.conn-dot) { display: none; }
      .conn-badge { padding: 8px; }
      .page { margin: 12px 10px 24px; padding: 14px 12px 22px; border-radius: 22px; }
      .header-row { align-items: flex-start; flex-direction: column; margin-bottom: 16px; padding: 20px 18px; border-radius: 18px; }
      .header-row.hero { padding: 24px 20px; align-items: flex-start; border-radius: 20px; }
      .data-scroll { height: clamp(300px, calc(100vh - 440px), 640px); }
      .pager { padding: 12px 14px; }
      /* Màn hình nhỏ: chỉ giữ dính cột UserName để còn chỗ xem dữ liệu */
      .data-table .col-idx { display: none; }
      .data-table tr > :nth-child(2) { left: 0; }
      .data-table .col-act { position: static; box-shadow: none; }
      .page-title { font-size: 25px; }
      .grid-stats { gap: 10px; }
      .stat-card { padding: 16px 14px 14px; }
      .stat-value { font-size: 23px; }
      .panel-head, .panel-body { padding: 15px; }
      .toolbar { padding: 12px 15px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

    /* =====================================================================
       Auth screens — đăng nhập / chờ duyệt / loading
       Một lớp nền "aurora" cố định nằm ngoài #root nên khi chuyển giữa các màn hình
       nền không bị chạy lại, chỉ phần nội dung chuyển cảnh.
       ===================================================================== */
    :root { --ease: cubic-bezier(.22, 1, .36, 1); --ease-io: cubic-bezier(.65, 0, .35, 1); }
    #root { position: relative; z-index: 1; }
    body.auth { background: #36070b; }

    .aurora {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
      background: linear-gradient(140deg, #c62828 0%, #8e1216 46%, #36070b 100%);
      opacity: 0; visibility: hidden; transition: opacity .5s ease, visibility 0s .5s;
    }
    body.auth .aurora { opacity: 1; visibility: visible; transition: opacity .5s ease; }
    .aurora .blob { position: absolute; border-radius: 50%; will-change: transform; }
    .aurora .b1 { width: 62vmax; height: 62vmax; left: -20vmax; top: -26vmax; background: radial-gradient(circle, rgba(255, 122, 107, .62), transparent 62%); animation: drift-a 22s ease-in-out infinite alternate; }
    .aurora .b2 { width: 58vmax; height: 58vmax; right: -22vmax; bottom: -28vmax; background: radial-gradient(circle, rgba(240, 84, 72, .52), transparent 62%); animation: drift-b 27s ease-in-out infinite alternate; }
    .aurora .b3 { width: 34vmax; height: 34vmax; left: 34%; top: 26%; background: radial-gradient(circle, rgba(255, 168, 120, .26), transparent 66%); animation: drift-c 31s ease-in-out infinite alternate; }
    .aurora .grid {
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, .055) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .055) 1px, transparent 1px);
      background-size: 46px 46px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 45%, #000 0%, transparent 72%); mask-image: radial-gradient(ellipse at 50% 45%, #000 0%, transparent 72%);
    }
    @keyframes drift-a { to { transform: translate3d(16vmax, 12vmax, 0) scale(1.14); } }
    @keyframes drift-b { to { transform: translate3d(-14vmax, -10vmax, 0) scale(1.1); } }
    @keyframes drift-c { to { transform: translate3d(-12vmax, 10vmax, 0) scale(1.25); } }

    /* Trình tự xuất hiện: chỉ chạy một lần khi vào màn hình (class is-entering) */
    .is-entering .rv { animation: rise .8s var(--ease) backwards; animation-delay: calc(var(--d, 0) * 1ms); }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
    @keyframes fade-in { from { opacity: 0; } }
    @keyframes panel-in { from { opacity: 0; transform: translateX(56px); } }
    @keyframes panel-in-up { from { opacity: 0; transform: translateY(48px); } }
    @keyframes card-in { from { opacity: 0; transform: translateY(30px) scale(.95); } }
    @keyframes row-in { from { opacity: 0; transform: translateX(-16px); } }
    @keyframes chip-in { from { opacity: 0; transform: scale(.7) translateY(10px); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes pop-in { from { opacity: 0; transform: scale(.94); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* ---------- Đăng nhập: chia đôi ---------- */
    .auth-split {
      /* Cụm nội dung nằm giữa màn hình: cột trái (giới thiệu) + thẻ đăng nhập nổi bên phải */
      min-height: 100vh; display: grid; align-items: center; justify-content: center;
      grid-template-columns: minmax(0, 500px) minmax(0, clamp(400px, 38vw, 440px));
      column-gap: clamp(48px, 6vw, 96px);
      width: min(1120px, calc(100% - 2 * clamp(24px, 5vw, 72px))); margin: 0 auto; padding: 48px 0;
    }
    .auth-showcase { position: relative; display: flex; flex-direction: column; gap: 28px; color: #fff; }
    .auth-brand { display: none; align-items: center; gap: 12px; }
    .auth-brand strong { font-size: 16px; letter-spacing: -.02em; }
    .auth-brand small { display: block; color: rgba(255, 225, 222, .74); font-size: 11px; margin-top: 3px; }
    .auth-stage { display: grid; gap: 40px; }
    .showcase-copy { max-width: 100%; }
    .showcase-copy h2 { margin: 0; font-size: clamp(28px, 2.9vw, 42px); line-height: 1.14; letter-spacing: -.04em; font-weight: 750; text-wrap: balance; }

    function toast(message, type = "") {
      const iconMap = { success: ICONS.toastSuccess, error: ICONS.toastError };
      const node = document.createElement("div");
      node.className = `toast ${type}`.trim();
      node.innerHTML = `<span class="toast-icon">${iconMap[type] || ICONS.toastInfo}</span><span class="toast-msg">${escapeHtml(message)}</span><button type="button" class="toast-close" aria-label="Đóng thông báo">${ICONS.close}</button><span class="toast-bar"></span>`;
      $("#toast-root").appendChild(node);
      const remove = () => { node.classList.add("leaving"); setTimeout(() => node.remove(), 200); };
      const timer = setTimeout(remove, 4200);
      node.querySelector(".toast-close").addEventListener("click", () => { clearTimeout(timer); remove(); });
    }

    // Hộp thoại xác nhận tùy chỉnh, thay cho confirm() mặc định của trình duyệt (xấu, không đồng bộ giao diện).
    // Trả về Promise<boolean>: true nếu người dùng bấm nút xác nhận, false nếu Hủy / Esc / bấm ra ngoài.
    function confirmDialog({ title = "Xác nhận", message = "", confirmText = "Xác nhận", cancelText = "Hủy", danger = true } = {}) {
      return new Promise(resolve => {
        const root = $("#confirm-root");
        const onKey = e => { if (e.key === "Escape") close(false); };
        const close = (result) => {
          document.removeEventListener("keydown", onKey);
          root.innerHTML = "";
          resolve(result);
        };
        root.innerHTML = `<div class="modal-backdrop confirm-backdrop" id="confirm-backdrop"><section class="modal confirm-modal">
          <div class="confirm-icon ${danger ? "danger" : "info"}">${danger ? ICONS.trash : ICONS.toastInfo}</div>
          <h2 class="confirm-title">${escapeHtml(title)}</h2>
          <p class="confirm-msg">${escapeHtml(message)}</p>
          <div class="confirm-actions">
            <button type="button" class="btn btn-secondary" id="confirm-cancel">${escapeHtml(cancelText)}</button>
            <button type="button" class="btn ${danger ? "btn-danger" : "btn-primary"}" id="confirm-ok">${escapeHtml(confirmText)}</button>
          </div>
        </section></div>`;
        document.addEventListener("keydown", onKey);
        $("#confirm-backdrop").addEventListener("click", e => e.target.id === "confirm-backdrop" && close(false));
        $("#confirm-cancel").addEventListener("click", () => close(false));
        $("#confirm-ok").addEventListener("click", () => close(true));
        $("#confirm-ok").focus();
      });
    }

        </div>
      </section></main>`;
    }

    function renderApp() {
      const tabs = [
        ["dashboard", "Tổng quan", ICONS.grid],
        ["dms", "DMS Userlist", ICONS.users],
        ["central", "Central User list", ICONS.users],
        ["tools", "Công Cụ Hỗ Trợ", ICONS.tools],
        ...(isAdmin() ? [["admin", "Quản lý dữ liệu", ICONS.database]] : [])
      ];
      if (!tabs.some(x => x[0] === state.tab)) state.tab = "dashboard";
      const activeTab = tabs.find(x => x[0] === state.tab) || tabs[0];
      return `<div class="app-shell">
        <aside class="sidebar" id="sidebar">
          <div class="brand"><div class="brand-mark">${ICONS.database}</div><div><strong>Masterdata DMS</strong><small>CCVN data workspace</small></div></div>
          <div class="nav-label">Workspace</div><nav class="nav">${tabs.map(([id, label, icon]) => `<button class="${state.tab === id ? "active" : ""}" data-tab="${id}">${icon}<span>${label}</span></button>`).join("")}</nav>
          <div class="sidebar-foot">
            <div class="user-card">
              <div class="user-chip"><div class="avatar">${initials(state.profile.display_name || state.profile.email)}</div><div><b>${escapeHtml(state.profile.display_name || "Người dùng")}</b><span>${escapeHtml(roleLabel(state.profile.role))}</span></div></div>
              <button class="signout" id="logout" title="Đăng xuất" aria-label="Đăng xuất">${ICONS.logout}</button>
            </div>
          </div>
        </aside>
        <main class="main">
          <header class="topbar">
            <div style="display:flex;align-items:center;gap:13px"><button class="mobile-menu" id="mobile-menu">${ICONS.menu}</button><div class="topbar-icon">${activeTab[2]}</div><div><h1>${escapeHtml(activeTab[1])}</h1><p>Quản lý masterdata CCVN tập trung và an toàn</p></div></div>
            <div class="topbar-right">
              <span class="conn-badge"><span class="conn-dot"></span><span>Kết nối an toàn</span></span>
            </div>
          </header>
          <section class="page">${renderPage()}</section>
        </main>
      </div>`;
    }

    function renderPage() {
      if (state.tab === "dashboard") return renderDashboard();
      if (state.tab === "dms" || state.tab === "central") return renderDataset();
      if (state.tab === "tools") return renderTools();
      if (state.tab === "admin" && isAdmin()) return renderAdmin();
      return renderDashboard();
    }

    function renderDashboard() {
      const recent = state.logs.slice(0, 5);
      return `<div class="header-row hero"><div><div class="eyebrow">Workspace overview</div><h2 class="page-title">Xin chào, ${escapeHtml((state.profile.display_name || "bạn").split(" ")[0])}</h2><p class="page-subtitle">Theo dõi nhanh trạng thái dữ liệu và quyền truy cập.</p></div>${isAdmin() ? `<button class="btn btn-light" data-tab="admin">${ICONS.upload} Import masterdata</button>` : ""}</div>
        <div class="grid-stats">
          <div class="stat-card"><div class="stat-label">DMS Userlist</div><div class="stat-value">${state.counts.dms.toLocaleString("vi-VN")}</div><div class="stat-note">bản ghi hiện có</div></div>
          <div class="stat-card"><div class="stat-label">Central User list</div><div class="stat-value">${state.counts.central.toLocaleString("vi-VN")}</div><div class="stat-note">bản ghi hiện có</div></div>
          <div class="stat-card"><div class="stat-label">Quyền của bạn</div><div class="stat-value" style="font-size:20px;margin-top:16px">${escapeHtml(roleLabel(state.profile.role))}</div><div class="stat-note">truy cập đã phê duyệt</div></div>
          <div class="stat-card"><div class="stat-label">Cập nhật gần nhất</div><div class="stat-value" style="font-size:18px;margin-top:17px">${recent[0] ? formatDate(recent[0].created_at).split(",")[0] : "—"}</div><div class="stat-note">${recent[0] ? "import masterdata" : "chưa có lịch sử import"}</div></div>
        </div>
        <div class="two-col">
          <section class="panel"><div class="panel-head"><div><h2>Truy cập nhanh</h2><p>Mở trực tiếp bảng dữ liệu cần xử lý.</p></div></div><div class="panel-body" style="display:grid;gap:11px">
            <button class="table-item" data-tab="dms"><div><b>DMS Userlist</b><span>${state.counts.dms.toLocaleString("vi-VN")} người dùng • khóa UserName</span></div><span class="go">→</span></button>
            <button class="table-item" data-tab="central"><div><b>Central User list</b><span>${state.counts.central.toLocaleString("vi-VN")} người dùng • khóa UserName</span></div><span class="go">→</span></button>
          </div></section>
          <section class="panel"><div class="panel-head"><div><h2>Lịch sử import</h2><p>Những lần cập nhật gần nhất.</p></div></div>${recent.length ? `<div class="table-wrap"><table><thead><tr><th>File</th><th>Thời gian</th><th>Trạng thái</th></tr></thead><tbody>${recent.map(log => `<tr><td><strong>${escapeHtml(log.file_name)}</strong></td><td>${formatDate(log.created_at)}</td><td>${log.status === "success" ? '<span class="badge badge-success">Thành công</span>' : '<span class="badge badge-danger">Lỗi</span>'}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty"><strong>Chưa có lịch sử import</strong>Chỉ Super-admin mới có thể nạp file masterdata.</div>`}</section>
        </div>`;
    }

    // ---------- Bảng dữ liệu: lọc → phân trang → dựng HTML ----------
    const searchIndex = new WeakMap();
    function rowSearchText(row, fields) {
      let text = searchIndex.get(row);
      if (text === undefined) { text = fields.map(([key]) => row[key] ?? "").join("\u0001").toLowerCase(); searchIndex.set(row, text); }
      return text;
    }
    let filterMemo = { rows: null, q: "", out: null, multi: null };
    let datasetMulti = null;   // thông tin tìm nhiều mã của lần lọc gần nhất (null = tìm thường)
    const multiBanner = mm => `<div class="tl-multi"><b>Đã dán ${nf(mm.total)} mã</b> · khớp ${nf(mm.total - mm.missing.length)}${mm.missing.length ? ` · <span class="bad">không thấy ${nf(mm.missing.length)}: ${escapeHtml(mm.missing.join(", "))}</span>` : ""}${mm.hidden ? ` · <span class="warn">${nf(mm.hidden)} account bị ẩn bởi bộ lọc Trạng thái</span>` : ""}</div>`;
    // Từ 2 mã trở lên (cách nhau bằng dấu cách / phẩy / xuống dòng) → khớp chính xác UserName, EmployeeCode hoặc Email;
    // không có kết quả nào thì quay về tìm chứa chuỗi như cũ
    function getFilteredRows(rows, fields, query) {
      const q = String(query || "").trim().toLowerCase();
      if (!q) { datasetMulti = null; return rows; }
      if (filterMemo.rows === rows && filterMemo.q === q) { datasetMulti = filterMemo.multi; return filterMemo.out; }
      let out = null, multi = null;
      const tokens = [...new Map(String(query).split(/[\s,;]+/).filter(Boolean).map(x => [x.toLowerCase(), x])).values()];
      if (tokens.length >= 2) {
        const want = new Set(tokens.map(x => x.toLowerCase())), found = new Set();
        out = rows.filter(row => { const hit = [row.username, row.employee_code, row.email].map(x => String(x ?? "").trim().toLowerCase()).filter(k => want.has(k)); hit.forEach(k => found.add(k)); return hit.length > 0; });
        if (found.size) multi = { total: tokens.length, missing: tokens.filter(x => !found.has(x.toLowerCase())), hidden: 0 };
        else out = null;
      }
      if (!out) out = rows.filter(row => rowSearchText(row, fields).includes(q));
      filterMemo = { rows, q, out, multi }; datasetMulti = multi;
      return out;
    }
    const nf = (n) => Number(n).toLocaleString("vi-VN");
    const cellHtml = (v) => (v === null || v === undefined || v === "") ? '<span class="nil">—</span>' : escapeHtml(v);

    function getDatasetView() {
      const isDms = state.tab === "dms";
      const fields = isDms ? DMS_FIELDS : CENTRAL_FIELDS;
      const rows = state[isDms ? "dms" : "central"];
      const filtered = getFilteredRows(rows, fields, state.search);
      const total = filtered.length;
      const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
      state.page = Math.min(Math.max(1, Math.floor(state.page) || 1), totalPages);
      const start = (state.page - 1) * state.pageSize;
      return { multi: datasetMulti, isDms, fields, rows, filtered, total, totalPages, start, pageRows: filtered.slice(start, start + state.pageSize) };
    }

    function rowBadgeText(v) {
      return state.search.trim() ? `${nf(v.total)} kết quả / ${nf(v.rows.length)} dòng` : `${nf(v.rows.length)} dòng`;
    }

    // Xuất dữ liệu đang được lọc (theo ô tìm kiếm) của tab hiện tại ra file Excel (.xlsx)
    function exportExcel() {
      if (typeof XLSX === "undefined") { toast("Không tải được thư viện xuất Excel.", "error"); return; }
      const v = getDatasetView();
      if (!v.filtered.length) { toast("Không có dữ liệu để xuất.", "error"); return; }
      const btn = $("#export-excel");
      const restore = btn ? btn.innerHTML : null;
      if (btn) { btn.disabled = true; btn.innerHTML = `<span class="btn-icon spin">${ICONS.refresh}</span> Đang xuất…`; }
      try {
        const header = v.fields.map(([, label]) => label);
        const rowsAoa = v.filtered.map(row => v.fields.map(([key]) => row[key] ?? ""));
        const ws = XLSX.utils.aoa_to_sheet([header, ...rowsAoa]);
        ws["!cols"] = header.map(h => ({ wch: Math.min(Math.max(String(h).length + 4, 14), 34) }));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, v.isDms ? "DMS Userlist" : "Central User list");
        const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
        const fileName = `${v.isDms ? "DMS_Userlist" : "Central_Userlist"}_${stamp}.xlsx`;
        XLSX.writeFile(wb, fileName);
        toast(`Đã xuất ${nf(v.filtered.length)} dòng ra "${fileName}".`, "success");
      } catch (err) {
        toast(`Xuất Excel thất bại: ${err.message}`, "error");
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = restore; }
      }
    }

    function pageItems(current, totalPages) {
      const set = new Set([1, totalPages, current - 1, current, current + 1]);
      if (current <= 3) [2, 3, 4].forEach(p => set.add(p));
      if (current >= totalPages - 2) [totalPages - 1, totalPages - 2, totalPages - 3].forEach(p => set.add(p));
      const pages = [...set].filter(p => p >= 1 && p <= totalPages).sort((a, b) => a - b);
      const out = [];
      pages.forEach((p, idx) => {
        if (idx) { const gap = p - pages[idx - 1]; if (gap === 2) out.push(p - 1); else if (gap > 2) out.push("…"); }
        out.push(p);
      });
      return out;
    }

    function renderPager(v) {
      const { total, totalPages, start, pageRows } = v, page = state.page;
      const from = total ? start + 1 : 0, to = start + pageRows.length;
      const btn = (p, label, { disabled = false, active = false, aria = `Trang ${p}` } = {}) =>
        `<button type="button" class="pager-btn${active ? " active" : ""}" data-page="${p}" aria-label="${aria}"${active ? ' aria-current="page"' : ""}${disabled ? " disabled" : ""}>${label}</button>`;
      const nav = [
        btn(page - 1, ICONS.pgPrev, { disabled: page === 1, aria: "Trang trước" }),
        ...pageItems(page, totalPages).map(p => p === "…" ? '<span class="pager-gap">…</span>' : btn(p, nf(p), { active: p === page })),
        btn(page + 1, ICONS.pgNext, { disabled: page === totalPages, aria: "Trang sau" })
      ].join("");
      return `<div class="pager">
        <div>Hiển thị <b>${nf(from)}–${nf(to)}</b> / <b>${nf(total)}</b> ${state.search.trim() ? "kết quả" : "dòng"}</div>
        <div class="pager-controls">
          <label class="pager-size">Số dòng / trang <select id="page-size" aria-label="Số dòng mỗi trang">${PAGE_SIZES.map(n => `<option value="${n}"${n === state.pageSize ? " selected" : ""}>${n}</option>`).join("")}</select></label>
          <nav class="pager-nav" aria-label="Phân trang">${nav}</nav>
          ${totalPages > 1 ? `<label class="pager-jump">Đến trang <input id="page-jump" type="number" min="1" max="${totalPages}" value="${page}" inputmode="numeric" aria-label="Đến trang số" /></label>` : ""}
        </div>
      </div>`;
    }

    function renderDatasetBody(v) {
      const { fields, pageRows, start, total } = v, bn = v.multi ? multiBanner(v.multi) : "";
      if (!total) {
        const msg = state.loading && !v.rows.length
          ? `<div class="loading"><i class="spinner"></i> <span data-loading-text>${loadingText()}</span></div>`
          : `<div class="empty"><strong>Không tìm thấy dữ liệu</strong>Thử đổi từ khóa tìm kiếm hoặc làm mới bảng.</div>`;
        return `${bn}<div class="table-wrap data-scroll is-empty">${msg}</div>${renderPager(v)}`;
      }
      const head = `<th class="col-idx">#</th>${fields.map(([, label]) => `<th>${escapeHtml(label)}</th>`).join("")}<th class="col-act">Thao tác</th>`;
      const body = pageRows.map((row, i) => `<tr><td class="col-idx">${nf(start + i + 1)}</td>${fields.map(([key]) => `<td>${key === "username" ? `<strong>${cellHtml(row[key])}</strong>` : cellHtml(row[key])}</td>`).join("")}<td class="col-act"><div style="display:flex;gap:4px">${canEdit() ? `<button class="btn btn-plain edit-row" data-key="${escapeHtml(row.username)}" title="Sửa">${ICONS.edit}</button>` : ""}${isAdmin() ? `<button class="btn btn-plain delete-row" data-key="${escapeHtml(row.username)}" title="Xóa" style="color:var(--danger)">${ICONS.trash}</button>` : ""}</div></td></tr>`).join("");
      return `${bn}<div class="table-wrap data-scroll" tabindex="0" aria-label="Bảng dữ liệu, cuộn ngang và dọc để xem đủ các cột"><table class="data-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${renderPager(v)}`;
    }

    function renderDataset() {
      const v = getDatasetView();
      return `<div class="header-row"><div><div class="eyebrow">${v.isDms ? "DMS directory" : "Central directory"}</div><h2 class="page-title">${v.isDms ? "DMS Userlist" : "Central User list"}</h2><p class="page-subtitle">${v.isDms ? "Danh sách người dùng DMS theo tenant, vùng và trạng thái." : "Danh sách nhân sự Central và thông tin hoạt động."}</p></div><div class="actions">${canEdit() ? `<button class="btn btn-light" id="new-row">${ICONS.plus} Thêm bản ghi</button>` : ""}</div></div>
        <section class="panel"><div class="toolbar">
          <div class="search${state.search ? " has-value" : ""}"><span class="search-icon">${ICONS.search}</span><input id="table-search" value="${escapeHtml(state.search)}" placeholder="Tìm theo tên, email, tenant… hoặc dán nhiều UserName" autocomplete="off" /><button type="button" class="search-clear" id="search-clear" aria-label="Xóa tìm kiếm" tabindex="-1">${ICONS.close}</button></div>
          <div class="toolbar-right">
            <span class="loading${state.loading ? "" : " hidden"}" data-loading><i class="spinner"></i><span data-loading-text>${loadingText()}</span></span>
            <span class="badge badge-blue" id="row-badge">${rowBadgeText(v)}</span>
            <button class="btn btn-excel" id="export-excel" title="Xuất dữ liệu đang hiển thị ra file Excel">${ICONS.xlsx} Xuất Excel</button>
            <button class="btn btn-secondary" id="refresh-data"${state.loading ? " disabled" : ""}><span class="btn-icon${state.loading ? " spin" : ""}">${ICONS.refresh}</span> Làm mới</button>
          </div>
        </div>
        <div id="dataset-body">${renderDatasetBody(v)}</div></section>`;
    }

    // Chỉ cập nhật phần bảng + phân trang (không dựng lại cả trang) → tìm kiếm/chuyển trang mượt, không mất focus ô tìm kiếm
    function updateDatasetBody() {
      const body = $("#dataset-body"); if (!body) return;
      const v = getDatasetView();
      body.innerHTML = renderDatasetBody(v);
      const badge = $("#row-badge"); if (badge) badge.textContent = rowBadgeText(v);
      bindDatasetBody();
    }
    function goToPage(p) {
      const n = Math.floor(Number(p));
      if (!Number.isFinite(n)) return updateDatasetBody();
      state.page = n; updateDatasetBody();
    }
    function bindDatasetBody() {
      const body = $("#dataset-body"); if (!body) return;
      body.querySelectorAll(".edit-row").forEach(el => el.addEventListener("click", () => openRowModal(el.dataset.key)));
      body.querySelectorAll(".delete-row").forEach(el => el.addEventListener("click", () => deleteRow(el.dataset.key)));
      body.querySelectorAll("[data-page]").forEach(el => el.addEventListener("click", () => goToPage(el.dataset.page)));
      $("#page-size")?.addEventListener("change", e => { state.pageSize = Number(e.target.value); state.page = 1; savePageSize(state.pageSize); updateDatasetBody(); });
      const jump = $("#page-jump");
      jump?.addEventListener("keydown", e => { if (e.key === "Enter") goToPage(jump.value); });
      jump?.addEventListener("change", () => goToPage(jump.value));
    }

    function renderAdmin() {
      return `<div class="header-row"><div><div class="eyebrow">Super-admin console</div><h2 class="page-title">Quản lý dữ liệu</h2><p class="page-subtitle">Chỉ Super-admin nhìn thấy khu vực này.</p></div></div>
        <div class="two-col">
          <section class="panel"><div class="panel-head"><div><h2>Import masterdata</h2><p>Upsert theo UserName — bản ghi cũ được cập nhật, bản ghi mới được thêm.</p></div></div><div class="panel-body">
            <div class="import-drop" id="dropzone">${ICONS.upload}<h3>Kéo thả file Excel vào đây</h3><p>Hỗ trợ file .xlsx có hai sheet <b>DMS Userlist</b> và <b>Central User list</b>. Chỉ Super-admin được phép import.</p><label class="btn btn-primary" for="file-input">${ICONS.file} Chọn file Excel</label><input id="file-input" type="file" accept=".xlsx,.xls" class="hidden" /></div>
            <div id="import-status" style="margin-top:14px"></div>
          </div></section>
          <section class="panel"><div class="panel-head"><div><h2>Các bảng dữ liệu</h2><p>RLS bảo vệ quyền truy cập tại Supabase.</p></div></div><div class="panel-body"><div class="table-list">
            <div class="table-item"><div><b>profiles</b><span>${state.profiles.length} tài khoản • quyền và trạng thái duyệt</span></div><span class="badge badge-blue">Auth</span></div>
            <div class="table-item"><div><b>dms_users</b><span>${state.counts.dms.toLocaleString("vi-VN")} bản ghi • upsert UserName</span></div><span class="badge badge-success">RLS</span></div>
            <div class="table-item"><div><b>central_users</b><span>${state.counts.central.toLocaleString("vi-VN")} bản ghi • upsert UserName</span></div><span class="badge badge-success">RLS</span></div>
            <div class="table-item"><div><b>import_logs</b><span>${state.logs.length} lần import gần đây</span></div><span class="badge badge-success">RLS</span></div>
          </div></div></section>
        </div>
        <section class="panel" style="margin-top:18px"><div class="panel-head"><div><h2>Phê duyệt tài khoản</h2><p>Duyệt yêu cầu Gmail mới và cấp role.</p></div><span class="badge badge-warning">${state.counts.pending} chờ duyệt</span></div>${renderProfilesTable()}</section>
        <section class="panel" style="margin-top:18px"><div class="panel-head"><div><h2>Lịch sử import</h2><p>Audit log do Supabase lưu lại.</p></div></div>${renderLogsTable()}</section>`;
    }

    function renderProfilesTable() {
      if (!state.profiles.length) return `<div class="empty"><strong>Chưa có tài khoản nào</strong>Người dùng mới sẽ xuất hiện sau khi đăng nhập Google.</div>`;
      return `<div class="table-wrap"><table style="min-width:760px"><thead><tr><th>Tài khoản</th><th>Role</th><th>Trạng thái</th><th>Ngày đăng ký</th><th>Thao tác</th></tr></thead><tbody>${state.profiles.map(p => `<tr><td><strong>${escapeHtml(p.display_name || "—")}</strong><br><span style="font-size:11px;color:var(--muted)">${escapeHtml(p.email)}</span></td><td><select class="role-select" data-id="${p.id}"  ${p.id === state.profile.id ? "disabled" : ""}><option value="member" ${p.role === "member" ? "selected" : ""}>Member</option><option value="senior-member" ${p.role === "senior-member" ? "selected" : ""}>Senior-member</option><option value="super-admin" ${p.role === "super-admin" ? "selected" : ""}>Super-admin</option></select></td><td>${statusBadge(p.approval_status)}</td><td>${formatDate(p.created_at)}</td><td><div style="display:flex;gap:5px;align-items:center">${p.approval_status !== "approved" ? `<button class="btn btn-secondary approve-user" data-id="${p.id}">Duyệt</button>` : ""}${p.approval_status === "approved" && p.id !== state.profile.id ? `<button class="btn btn-danger reject-user" data-id="${p.id}">Thu hồi</button>` : ""}${p.id !== state.profile.id ? `<button class="btn btn-outline-danger delete-profile" data-id="${p.id}" data-name="${escapeHtml(p.display_name || p.email)}" title="Xóa tài khoản">${ICONS.trash} Xóa</button>` : ""}</div></td></tr>`).join("")}</tbody></table></div>`;
    }

    function renderLogsTable() {
      if (!state.logs.length) return `<div class="empty"><strong>Chưa có lịch sử</strong>Các lần import thành công và thất bại sẽ được lưu ở đây.</div>`;

        toast(`Đã xuất phiếu "${fileName}".`, "success");

    function bindToolEvents() {
      const pg = $("#tool-page"); if (!pg) return;
      let timer;
      pg.addEventListener("click", e => {
        const t = e.target, m = t.closest("[data-tl-mode]");
        if (m) { tool.mode = m.dataset.tlMode; saveKey(TOOL_MODE_KEY, tool.mode); tool.status = ""; $("#tool-root").innerHTML = renderToolBody(); return; }
        const tr = t.closest("tr[data-pk]");
        if (tr) {
          const cb = tr.querySelector("input"); if (t !== cb) cb.checked = !cb.checked;
          tr.classList.toggle("sel", cb.checked);
          tool.picked = tool.picked.filter(k => k !== tr.dataset.pk); if (cb.checked) tool.picked.push(tr.dataset.pk);
          toolDrawPersons(); return;
        }
        const a = t.closest("[data-tl]"); if (!a) return;
        const act = a.dataset.tl, i = Number(a.dataset.i);
        if (act === "export") toolExport();
        else if (act === "add") { tool.list.push(blankPerson()); toolDrawPersons(); }
        else if (act === "pickall") {
          const rows = toolListRows();
          if (!rows.length) return toast("Không có kết quả để chọn.", "error");
          if (rows.length > 200) return toast(`Có ${nf(rows.length)} kết quả — hãy thu hẹp còn tối đa 200 account rồi chọn.`, "error");
          const have = new Set(tool.picked); rows.forEach(r => have.has(r.username) || tool.picked.push(r.username));
          $("#tl-list").innerHTML = renderToolList(); toolDrawPersons(); toast(`Đã chọn ${nf(rows.length)} account.`, "success");
        }
        else if (act === "clear") { tool.picked = []; $("#tl-list").innerHTML = renderToolList(); toolDrawPersons(); }
        else if (act === "remove") {
          if (tool.mode === "create") tool.list.splice(i, 1);
          else { const k = tool.picked.splice(i, 1)[0], row = [...pg.querySelectorAll("tr[data-pk]")].find(x => x.dataset.pk === k); if (row) { row.classList.remove("sel"); row.querySelector("input").checked = false; } }
          toolDrawPersons();
        } else if (act === "copy") {
          const { p, old } = toolPersons()[i] || {};
          if (old) { Object.assign(p, { desc: old.description || "", role: old.role_name || p.role, terr: old.territory_hierarchy || "", touched: true }); toolDrawPersons(); }
        }
      });
      pg.addEventListener("input", e => {
        const t = e.target;
        if (t.id === "tl-search") { tool.q = t.value; clearTimeout(timer); timer = setTimeout(() => { $("#tl-list").innerHTML = renderToolList(); }, 150); return; }
        if (!t.dataset.f) return;
        const p = toolPersons()[Number(t.dataset.i)]?.p; if (!p) return;
        p[t.dataset.f] = t.value; p.touched = true;
        if (t.dataset.f === "username" && !p.codeEdited) { p.code = t.value; const c = pg.querySelector(`[data-i="${t.dataset.i}"][data-f="code"]`); if (c) c.value = t.value; }
        if (t.dataset.f === "code") p.codeEdited = !!t.value;
        toolRefresh();
      });
      pg.addEventListener("paste", e => {   // input 1 dòng sẽ làm mất xuống dòng khi dán → đổi thành dấu cách
        const t = e.target; if (t.id !== "tl-search") return;
        e.preventDefault();
        t.setRangeText((e.clipboardData || window.clipboardData).getData("text").replace(/[\r\n\t;,]+/g, " ").trim() + " ", t.selectionStart, t.selectionEnd, "end");
        t.dispatchEvent(new Event("input", { bubbles: true }));
      });
      pg.addEventListener("change", e => { if (e.target.id === "tl-status") { tool.status = e.target.value; $("#tl-list").innerHTML = renderToolList(); } });
    }

    async function boot() {
      state.booting = configured();
      render();
      if (!configured()) return;
      state.supabase = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
      state.supabase.auth.onAuthStateChange(async (_event, session) => {
        state.session = session;
        // Cửa sổ này chỉ là popup phụ để hoàn tất OAuth Google; khi đã có session thì đóng lại,
        // cửa sổ chính (window.opener) sẽ tự nhận session qua đồng bộ đa-tab của Supabase.
        if (window.opener && session) { setTimeout(() => window.close(), 300); return; }
        await resolveProfile(); state.booting = false; render();
      });
      try {
        const { data } = await state.supabase.auth.getSession();
        state.session = data.session; await resolveProfile();
      } finally { state.booting = false; render(); }
    }

    async function resolveProfile() {
      if (!state.session) { state.profile = null; return; }
      const { data, error } = await state.supabase.from("profiles").select("*").eq("id", state.session.user.id).maybeSingle();
      if (error) { toast(`Không đọc được hồ sơ: ${error.message}`, "error"); state.profile = null; return; }
      if (data) {
        state.profile = data;
      } else {
        // Lần đăng nhập Google đầu tiên: chưa có dòng profiles tương ứng.
        // Tự tạo hồ sơ ở trạng thái chờ duyệt để hiển thị đúng màn hình renderPending() thay vì kẹt ở loading.
        const email = state.session.user.email || "";
        const displayName = state.session.user.user_metadata?.full_name || state.session.user.user_metadata?.name || email;
        const { data: created, error: insertError } = await state.supabase
          .from("profiles")
          .insert({ id: state.session.user.id, email, display_name: displayName, approval_status: "pending" })
          .select()
          .maybeSingle();
        if (insertError) {
          // Có thể một trigger phía Supabase đã tạo hồ sơ ngay trước đó (race condition) — đọc lại 1 lần.
          const retry = await state.supabase.from("profiles").select("*").eq("id", state.session.user.id).maybeSingle();
          if (retry.data) {
            state.profile = retry.data;
          } else {
            // Không tự tạo được hồ sơ (có thể do RLS chặn insert) — vẫn hiển thị màn hình chờ duyệt
            // tạm thời trên giao diện, nhưng cần kiểm tra RLS/trigger để hồ sơ thực sự được lưu và
            // xuất hiện trong danh sách phê duyệt của Super-admin.
            toast(`Không tạo được hồ sơ mới: ${insertError.message}`, "error");
            state.profile = { id: state.session.user.id, email, display_name: displayName, approval_status: "pending" };
          }
        } else {
          state.profile = created;
        }
      }
      if (state.profile?.approval_status === "approved") await loadData();
      subscribeProfileChanges(state.session.user.id);
    }

    function subscribeProfileChanges(userId) {
      if (profileChannel) { state.supabase.removeChannel(profileChannel); profileChannel = null; }
      if (!userId) return;
      profileChannel = state.supabase
        .channel(`${APP_CHANNEL_PREFIX}:profile-${userId}`)
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "profiles", filter: `id=eq.${userId}` }, async (payload) => {
          state.profile = payload.new;
          if (state.profile.approval_status === "approved") { toast("Tài khoản của bạn đã được phê duyệt!", "success"); await loadData(); }
          render();
        })
        .subscribe();
      // Nếu là Super-admin, lắng nghe luôn kênh thông báo "có người vừa gửi yêu cầu chờ duyệt".
      if (isAdmin()) subscribeAdminNotifications(); else if (adminChannel) { state.supabase.removeChannel(adminChannel); adminChannel = null; }
    }

    function subscribeAdminNotifications() {
      if (adminChannel) { state.supabase.removeChannel(adminChannel); adminChannel = null; }
      adminChannel = state.supabase
        .channel(`${APP_CHANNEL_PREFIX}:admin-notify`)
        .on("broadcast", { event: "new-request" }, async (payload) => {
          const p = payload.payload || {};
          toast(`${p.display_name || p.email || "Một tài khoản"} vừa gửi yêu cầu phê duyệt.`);
          await loadData();

        .subscribe();
